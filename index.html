  // mine = บรรทัดของใบรับที่กำลังแก้ (ไม่นับรวมใน "ได้แล้ว")
  function recvFromPo(po, mineByKey) {
    mineByKey = mineByKey || {};
    return {
      po_id: po.id, supplier_name: po.supplier_name || '', amount: '', photos: [], note: '', q: '', busy: false, sending: false,
      lines: po.lines.filter(function (l) { return l.qty > 0; }).map(function (l) {
        var mine = mineByKey[l.key], prev = L.round2((l.received || 0) - (mine ? mine.qty : 0));
        return recvWeigh({
          key: l.key, item_id: l.item_id, name_th: l.name_th, name_mm: l.name_mm || '', order_name: l.order_name || '', unit: l.unit, unit_mm: l.unit_mm || UNITS[l.unit] || '',
          size: l.size || '', ordered: l.qty, prev: prev, remaining: Math.max(0, L.round2(l.qty - prev)),
          locked: !mine && L.lineDone(l), factor: l.factor || 1, count_unit: l.count_unit || l.unit,
          qty: mine ? String(mine.qty) : '', count: mine && mine.count ? String(mine.count) : '', ticked: !!mine,
          price: mine && mine.price ? mine.price : '', amount: mine && mine.amount ? mine.amount : '',
          done: mine ? !!mine.done : L.isMeasured(l.unit), extra: false
        });
      })
    };
  }

  // เปิดใบรับเดิมมาแก้ (ทั้งน้องและบอสใช้หน้าเดียวกัน)
  function recvFromReceipt(rc, po, admin) {
    var mine = {};
    rc.lines.forEach(function (l) { mine[l.key] = l; });
    var R = po ? recvFromPo(po, mine) : { po_id: 0, supplier_name: rc.supplier_name || '', amount: '', photos: [], note: '', q: '', busy: false, sending: false, lines: [] };
    var inPo = {};
    R.lines.forEach(function (l) { inPo[l.key] = true; });
    rc.lines.forEach(function (l) {
      if (inPo[l.key]) return;
      var it = l.item_id ? itemById(l.item_id) : null;
      R.lines.push(recvWeigh({ key: l.key, item_id: l.item_id || '', name_th: l.name_th, name_mm: l.name_mm || '', unit: l.unit, unit_mm: UNITS[l.unit] || (it && it.unit_mm) || '',
        size: l.size || '', ordered: 0, prev: 0, remaining: 0, factor: l.conv && l.qty ? L.round2(l.qty_count / l.qty) : 1, count_unit: l.count_unit || l.unit,
        qty: String(l.qty), count: l.count ? String(l.count) : '', ticked: true, extra: true, price: l.price || '', amount: l.amount || '' }));
    });
    R.amount = rc.amount ? String(rc.amount) : '';
    R.note = rc.note || '';
    R.edit = { id: rc.id, by: rc.by, at: rc.at, admin: !!admin, note0: rc.note || '', amount0: R.amount, supplier0: rc.supplier_name || '',
      photoCount: String(rc.photos || '').split(',').filter(Boolean).length, back: S.screen };
    return R;
  }

  function recvSaveEdit(p) {
    var R = S.recv, ed = R.edit;
    R.sending = true;
    rerenderKeepScroll();
    var call = ed.admin ? api('apiAdminReceiptEdit', S.admin.pin, ed.id, p) : api('apiReceiptEdit', S.pin, S.me, ed.id, p);
    call.then(function (res) {
      if (S.boot) S.boot.pos = res.pos;
      S.recvList = res.pos;
      if (ed.admin) {
        toast(p.void ? 'ยกเลิกใบรับ ' + ed.id + ' แล้ว' : 'แก้ใบรับ ' + ed.id + ' แล้ว ✓');
        if (ed.back === 'apodetail' && S.admin.poView) {
          return api('apiAdminPoDetail', S.admin.pin, S.admin.poView.po.id).then(function (v) { S.admin.poView = v; go('apodetail'); });
        }
        return loadAdmin(S.admin.pin, 'history');
      }
      toast('✅ ' + (p.void ? tr('voided').th + ' · ' + tr('voided').mm : tr('editSaved').th + ' · ' + tr('editSaved').mm));
      go('recv');
      refreshRecvList();
    }, function (e) {
      R.sending = false;
      rerenderKeepScroll();
      toast(isNetErr(e) ? tr('offline').th : tr('error').th + ': ' + errMsg(e));
    });
  }

  function recvIsShort(l) { var q = Number(l.qty); return !l.extra && l.ordered > 0 && q > 0 && q < l.remaining - 1e-9 && !(l.g && Math.round((l.remaining - q) * l.g) === 0); }

  // ของชั่งน้ำหนัก (สั่งเป็น กก./ขีด/กรัม): น้องใส่กรัมตามตาชั่ง แอพแปลงเป็นหน่วยที่สั่งเอง (l.g = 1 หน่วยสั่งกี่กรัม)
  function recvWeigh(l) {
    l.g = L.gramsPer(l.unit);
    var cg = L.gramsPer(l.count_unit);
    l.grams = !l.g || !(Number(l.qty) > 0) ? '' : String(L.round2(cg && Number(l.count) > 0 ? Number(l.count) * cg : Number(l.qty) * l.g));
    return l;
  }
  function gramsTxt(n) { return L.fmtNum(L.round2(n)) + ' กรัม'; }

  // ใส่จำนวนแล้ว: ตรง/เกิน = บอกเฉยๆ · ขาด = เลือก "ถือว่าครบ" (ค่าตั้งต้นของชั่งน้ำหนัก) หรือ "รอของมาเพิ่ม" (ค่าตั้งต้นของนับชิ้น)
  function recvShortHtml(l, i) {
    var q = Number(l.qty);
    if (l.extra || !(l.ordered > 0) || !(q > 0)) return '';
    var d = l.remaining - q, n = l.g ? L.fmtNum(L.round2(Math.abs(d) * l.g)) : L.fmtNum(L.round2(Math.abs(d)));
    var u = l.g ? 'กรัม' : l.unit, um = l.g ? (UNITS['กรัม'] || 'กรัม') : (l.unit_mm || l.unit);
    if (!recvIsShort(l)) {
      if (d < -1e-9 && !(l.g && Math.round(-d * l.g) === 0)) return '<div class="hint">➕ ' + bi1('overBy', { n: n, u: u, um: um }) + '</div>';
      return l.g ? '<div class="hint" style="color:var(--ok)">✓ ' + bi1('exactOk') + '</div>' : '';
    }
    return '<div class="short-pick"><div class="hint" style="color:var(--warn)">' + bi1('shortBy', { n: n, u: u, um: um }) + '</div>' +
      '<div class="seg"><button class="' + (l.done ? 'on' : '') + '" data-act="recvShort" data-k="' + i + '" data-v="1">✓ ' + bi1('countAsDone') + '</button>' +
      '<button class="' + (l.done ? '' : 'on') + '" data-act="recvShort" data-k="' + i + '" data-v="0">⏳ ' + bi1('waitMore') + '</button></div></div>';
  }

  function recvLineHtml(l, i) {
    var done = l.locked || (!l.extra && l.ordered > 0 && l.remaining <= 0 && !(Number(l.qty) > 0));
    var unit = esc(l.unit) + (l.size ? ' (' + esc(l.size) + ')' : '') + (l.unit_mm ? ' <span class="mm">' + esc(l.unit_mm) + '</span>' : '');
    // ช่องหน้าชื่อ = แค่บอกสถานะ (ใส่ตัวเลขแล้วขึ้น ✓ เอง) ไม่ต้องกด
    var h = '<div class="card rline' + (l.ticked ? ' on' : '') + (done ? ' done' : '') + '" id="rl-' + i + '">' +
      '<span class="tick' + (l.ticked || done ? ' on' : '') + '" aria-hidden="true">' + (l.ticked || done ? '✓' : l.g ? '⚖️' : '') + '</span>' +
      '<div class="nm"><b>' + esc(l.name_th) + '</b><span class="mm">' + esc(l.name_mm) + '</span>' +
      (l.order_name ? '<div class="hint">🧾 ' + esc(l.order_name) + '</div>' : '') +
      (l.fromBill ? '<div class="hint bill-tag' + (l.fromBill === 'low' ? ' low' : '') + '">🤖 ' + bi1(l.fromBill === 'low' ? 'billCheckThis' : 'billFromBill') +
        (Number(l.amount) > 0 ? ' · ฿' + L.fmtNum(Number(l.amount)) : '') + '</div>' : Number(l.amount) > 0 ? '<div class="hint bill-tag">🧾 ฿' + L.fmtNum(Number(l.amount)) + '</div>' : '');
    if (l.ordered > 0) {
      h += '<div class="hint">' + esc(tr('ordered').th) + ' <b>' + L.fmtNum(l.ordered) + '</b> ' + unit + (l.g > 1 ? ' = <b>' + gramsTxt(l.ordered * l.g) + '</b>' : '') +
        (l.prev ? ' · ได้แล้ว ' + (l.g ? gramsTxt(l.prev * l.g) : L.fmtNum(l.prev)) : '') +
        ' <span class="mm">(' + esc(tr('ordered').mm) + ' ' + L.fmtNum(l.ordered) + (l.unit_mm ? ' ' + esc(l.unit_mm) : '') + ')</span></div>';
    }
    if (done) h += '<div class="hint" style="color:var(--ok)">' + bi1('allArrived') + '</div>';
    else if (l.g) {
      // ของชั่ง: ใส่กรัมตามตาชั่งช่องเดียว
      h += '<div class="rqty"><span>⚖️ ' + bi1('weighGot') + '</span><span class="rq-in"><input type="number" inputmode="decimal" step="any" min="0" class="inp sm wide" data-input="recvGrams" data-k="' + i + '" value="' + esc(l.grams) + '" placeholder="0">' +
        '<span>กรัม <span class="mm">' + esc(UNITS['กรัม'] || '') + '</span></span></span></div>';
    } else {
      var full = l.ordered > 0 && l.remaining > 0 && Number(l.qty) === l.remaining;
      h += '<div class="rqty"><span>' + bi1('arrived') + '</span><span class="rq-in"><input type="number" inputmode="decimal" step="any" min="0" class="inp sm" data-input="recvQty" data-k="' + i + '" value="' + esc(l.qty) + '" placeholder="0">' +
        (l.extra && !l.item_id ? '<input type="text" class="inp sm" style="width:72px" data-input="recvUnit" data-k="' + i + '" value="' + esc(l.unit) + '" placeholder="หน่วย">' : '<span>' + unit + '</span>') + '</span>' +
        (l.ordered > 0 && l.remaining > 0 ? '<button class="full-btn' + (full ? ' on' : '') + '" data-act="recvFull" data-k="' + i + '">✓ ' + esc(tr('allArrived').th) + ' ' + L.fmtNum(l.remaining) + ' <span class="mm">' + esc(tr('allArrived').mm) + '</span></button>' : '') + '</div>';
    }
    if (!done) {
      if (l.factor && l.factor !== 1 && !(l.g && L.gramsPer(l.count_unit))) {
        h += '<div class="rqty"><span>' + bi1('countedIfAny') + '</span><input type="number" inputmode="decimal" step="any" min="0" class="inp sm" data-input="recvCount" data-k="' + i + '" value="' + esc(l.count) + '" placeholder="≈' + L.fmtNum(L.round2((Number(l.qty) || l.remaining || 0) * l.factor)) + '"><span>' + esc(l.count_unit) + (UNITS[l.count_unit] ? ' <span class="mm">' + esc(UNITS[l.count_unit]) + '</span>' : '') + '</span></div>';
      }
      h += '<div id="rl-sh-' + i + '">' + recvShortHtml(l, i) + '</div>';
    }
    if (l.extra) h += '<button class="mini-x" data-act="recvDel" data-k="' + i + '" aria-label="ลบ">✕</button>';
    return h + '</div></div>';
  }

  function extraLine(it) {
    var conv = it.buy_unit && it.buy_factor > 0;
    return recvWeigh({ key: it.id, item_id: it.id, name_th: it.name_th, name_mm: it.name_mm || '', unit: conv ? it.buy_unit : it.unit,
      unit_mm: conv ? (UNITS[it.buy_unit] || '') : unitMm(it), size: conv ? '' : (it.size || ''), ordered: 0, prev: 0, remaining: 0,
      factor: conv ? it.buy_factor : 1, count_unit: it.unit, qty: '', count: '', ticked: false, extra: true });
  }

  // ---------- อ่านบิลด้วย Claude: ใส่จำนวน (แปลงหน่วย) + ยอดเงินให้ แล้วน้องตรวจก่อนกดยืนยัน ----------
  function billSetLine(l, x) {
    var u = x.unit || l.unit;
    if (l.g) {
      var g = L.gramsPer(u) || (u === l.unit ? l.g : 0);
      if (!g) return false;
      var grams = L.round2(x.qty * g), cg = L.gramsPer(l.count_unit);
      l.grams = String(grams);
      l.qty = String(Math.round(grams / l.g * 10000) / 10000);
      if (l.factor !== 1 && cg) l.count = String(L.round2(grams / cg));
    } else {
      var f = u === l.unit ? 1 : L.unitFactor(u, l.unit);
      if (!f) return false;
      l.qty = String(L.round2(x.qty * f));
    }
    var amt = x.amount || L.round2((x.unit_price || 0) * x.qty);
    l.amount = amt || '';
    l.price = amt && Number(l.qty) > 0 ? L.round2(amt / Number(l.qty)) : '';
    l.ticked = Number(l.qty) > 0;
    l.fromBill = x.confidence || 'medium';
    return true;
  }
  function billApply(R, b) {
    var out = { readable: b.readable, filled: 0, unmatched: [], unsure: [], note: b.note, shop: b.shop, total: b.total };
    (b.lines || []).forEach(function (x) {
      if (!(x.qty > 0) || !x.match) { if (x.text) out.unmatched.push(x); return; }
      var l = R.lines.filter(function (y) { return y.key === x.match || (y.item_id && y.item_id === x.match); })[0];
      if (!l && x.kind === 'item' && itemById(x.match)) { l = extraLine(itemById(x.match)); R.lines.push(l); }
      if (!l) { out.unmatched.push(x); return; }
      if (l.locked) return;
      if (billSetLine(l, x)) out.filled++; else out.unsure.push(x);
    });
    if (!(Number(R.amount) > 0) && b.total) R.amount = String(b.total);
    R.bill = out;
  }
  function billLineText(x) { return esc(x.text) + (x.qty ? ' ' + L.fmtNum(x.qty) + ' ' + esc(x.unit) : '') + (x.amount ? ' · ฿' + L.fmtNum(x.amount) : ''); }
  function billResultHtml(R) {
    var b = R.bill;
    if (!b) return '';
    if (!b.readable) return '<div class="note warn" style="margin-top:10px">' + bi1('billUnreadable') + '</div>';
    var h = b.filled ? '<div class="note ok" style="margin-top:10px">✓ ' + bi1('billFilled', { n: b.filled }) + (b.total ? '<br>🧾 ' + esc(tr('billAmount').th) + ' ฿' + L.fmtNum(b.total) : '') + '</div>' : '';
    if (b.unsure.length) h += '<div class="note warn" style="margin-top:8px">' + bi1('billUnitUnsure') + '<br>' + b.unsure.map(billLineText).join('<br>') + '</div>';
    if (b.unmatched.length) h += '<div class="note info" style="margin-top:8px">' + bi1('billUnmatched') + '<br>' + b.unmatched.map(billLineText).join('<br>') + '</div>';
    if (b.note) h += '<p class="muted" style="font-size:13px;margin:8px 0 0">🤖 ' + esc(b.note) + '</p>';
    return h;
  }

  function recvRowUpdate(i) {
    var l = S.recv.lines[i];
    l.ticked = Number(l.qty) > 0;
    var row = document.getElementById('rl-' + i);
    if (!row) return;
    row.classList.toggle('on', l.ticked);
    var t = row.querySelector('.tick');
    if (t) { t.classList.toggle('on', l.ticked); t.textContent = l.ticked ? '✓' : l.g ? '⚖️' : ''; }
    var f = row.querySelector('.full-btn');
    if (f) f.classList.toggle('on', Number(l.qty) === l.remaining);
    var c = row.querySelector('[data-input=recvCount]');
    if (c) c.placeholder = '≈' + L.fmtNum(L.round2((Number(l.qty) || 0) * l.factor));
    var sh = document.getElementById('rl-sh-' + i);
    if (sh) sh.innerHTML = recvShortHtml(l, i);
  }

  function recvPicks() {
    var q = (S.recv.q || '').trim().toLowerCase();
    if (!q) return '';
    var hits = items().filter(function (it) { return matchItem(it, q); })
      .sort(function (a, b) { return L.searchScore(b, q) - L.searchScore(a, q) || (a.kind === 'buy' ? 0 : 1) - (b.kind === 'buy' ? 0 : 1); }).slice(0, 8);
    return hits.map(function (it) {
      return '<button data-act="recvPick" data-id="' + esc(it.id) + '">' + esc(it.name_th) + '<span class="mm">' + esc(it.name_mm) + '</span></button>';
    }).join('') + '<button data-act="recvPickText">✍️ ใช้คำว่า "' + esc(S.recv.q) + '"</button>';
  }

  function refreshRecvList() {
    if (S.pubLive && S.boot) { S.recvList = S.boot.pos || []; S.recvLoading = false; if (S.screen === 'recv') rerenderKeepScroll(); return; }
    S.recvLoading = true;
    if (S.screen === 'recv') rerenderKeepScroll();
    var recent = api('apiRecvRecent', S.pin).then(function (list) { S.recvRecent = list; }, function () { /* รุ่นหลังบ้านเก่า/เน็ตหลุด: ไม่แสดง */ });
    api('apiPoList', S.pin).then(function (list) {
      S.recvList = list;
      if (S.boot) S.boot.pos = list;
    }, function () { /* ใช้รายการเดิมไปก่อน */ }).then(function () { return recent; }).then(function () {
      S.recvLoading = false;
      if (S.screen === 'recv' || S.screen === 'home') rerenderKeepScroll();
    });
  }

  function copyText(text) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
      return ok ? Promise.resolve() : Promise.reject(new Error('copy'));
    }
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).catch(fallback);
    return fallback();
  }

  // ปุ่มที่เก็บบนหน้าแรก: ไอคอน + ชื่อ + นับแล้วกี่รายการ + แถบ · สีบอกสถานะ (เขียว = ครบ, ขอบเขียวเข้ม = กำลังนับ)
  function zoneTile(z, sum, optional) {
    var st = sum.zones[z.id];
    var pct = st.total ? Math.round(st.counted / st.total * 100) : 0;
    var done = st.total && st.counted === st.total;
    var meta = (st.below ? '<span class="tag bad">▼ ' + st.below + '</span>' : '') +
      (st.counted && !done && st.by.length ? '<span class="who">👤 ' + esc(st.by.join(', ')) + '</span>' : '') +
      (st.todo && !st.due ? '<span class="tag warn">' + bi1('todayHere', { n: st.todo }) + '</span>' : '');
    return '<button class="ztile' + (done ? ' done' : st.counted ? ' doing' : '') + (optional ? ' optional' : '') + '" data-act="openZone" data-z="' + z.id + '">' +
      '<span class="zt-top"><span class="ic">' + z.icon + '</span><span class="cnt">' + (done ? '✓ ' : '') + st.counted + '/' + st.total + '</span></span>' +
      '<b>' + esc(z.th) + (optional ? ' 📅' : '') + '</b><span class="mm">' + esc(z.mm) + '</span>' +
      '<span class="bar"><i style="width:' + pct + '%"></i></span>' + (meta ? '<span class="zt-meta">' + meta + '</span>' : '') + '</button>';
  }
  function actTile(act, icon, key, badge, cls) {
    return '<button class="atile' + (cls ? ' ' + cls : '') + '" data-act="' + act + '"><span class="ic">' + icon + '</span><b>' + esc(tr(key).th) + '</b><span class="mm">' + esc(tr(key).mm) + '</span>' +
      (badge ? '<span class="badge' + (cls === 'has' ? ' brand' : '') + '">' + badge + '</span>' : '') + '</button>';
  }
  function recvTile() { var n = ((S.boot && S.boot.pos) || []).length; return actTile('toRecv', '📦', 'receive', n, n ? 'has' : ''); }
  function prepTile(sum) {
    if (!items().some(function (it) { return it.kind === 'prep' && inMyZones(it); })) return '';
    return actTile('toPrep', '🔪', 'prepToday', sum.prep.length, sum.prep.length ? 'urge' : '');
  }

  // วัตถุดิบตามสูตร (จำนวนรอบที่ต้องทำ) — ชื่อพม่าถ้ามีในรายการของ
  function recipeUseHtml(it, need) {
    var rc = S.boot && S.boot.recipes && S.boot.recipes[it.id], n = L.recipeRounds(rc, need);
    if (!n) return '';
    var th = [], mm = [];
    rc.lines.forEach(function (l) {
      var x = l.item_id ? itemById(l.item_id) : null, q = L.fmtNum(L.round2(l.qty * n));
      th.push(l.name + ' ' + q + ' ' + l.unit);
      mm.push((x && x.name_mm ? x.name_mm : l.name) + ' ' + q + ' ' + (UNITS[l.unit] || l.unit));
    });
    var t = tr('recipeUse', { n: n });
    return '<small class="rc-use">🧾 ' + esc(t.th) + ': ' + esc(th.join(' · ')) + '</small><small class="mm rc-use">' + esc(t.mm) + ': ' + esc(mm.join(' · ')) + '</small>';
  }

  function needLabel(it) { return it.kind === 'prep' ? 'toMake' : 'toBuy'; }

  // หน่วยพม่า: ของรายการ (ถ้าเป็นอักษรพม่าจริง) ไม่งั้นจากตารางหน่วย — น้องต้องเห็นหน่วยภาษาตัวเองทุกที่ที่ใส่ตัวเลข กันนับผิดหน่วย
  function unitMm(it) {
    if (it.unit_mm && L.hasBurmese(it.unit_mm)) return it.unit_mm;
    return UNITS[it.unit] || '';
  }
  // "หลอด (500g) · ချောင်း"
  function unitBi(it) {
    var mm = unitMm(it);
    return esc(L.unitText(it)) + (mm ? ' <span class="mm nw">(' + esc(mm) + ')</span>' : '');
  }
  // ป้ายหน่วยใต้/ข้างตัวเลข: พม่าก่อน ไทยตามหลัง
  function unitTag(it) {
    var mm = unitMm(it);
    return (mm ? '<span class="mm">' + esc(mm) + '</span> ' : '') + '<span class="th">' + esc(it.unit) + '</span>';
  }

  function rowHtml(it) {
    var e = entry(it.id), cfg = L.isConfigured(it), z = hereZone(it), se = slotVal(it, z), has = L.hasCount(se);
    var multi = isMulti(it), total = L.hasCount(e);
    var need = cfg && total ? L.needQty(it, e.v) : null;
    var lowlv = !cfg && has && (se.lv === 'low' || se.lv === 'out');
    var cls = 'card row' + (has ? ' counted' : '') + (need > 0 || (lowlv && se.lv === 'out') ? ' below' : lowlv ? ' lowlv' : '') + (S.kp && S.kp.id === it.id ? ' active' : '');
    var hint = cfg
      ? '<span>Min ' + L.fmtNum(it.min) + ' · Max ' + L.fmtNum(it.max) + ' ' + unitBi(it) + '</span>'
      : '<span class="tag warn">⚠️ ' + bi1('notSetShort') + '</span>';
    if (has && se.by && se.by !== S.me) hint += ' <span class="tag">' + esc(tr('countedBy').th) + ' ' + esc(se.by) + '</span>';
    if (multi) hint += '<div class="multi">📍 ' + multiHint(it, e) + '</div>';
    var h = '<div class="' + cls + '" id="r-' + esc(it.id) + '"><div class="nm"><b>' + esc(it.name_th) + '</b><span class="mm">' + esc(it.name_mm) + '</span>' +
      '<div class="hint">' + hint + '</div>';
    if (need > 0) {
      var nl = tr(needLabel(it));
      h += '<div class="need"><span class="tag bad"><b>' + esc(nl.th) + ' ' + L.fmtNum(need) + ' ' + esc(it.unit) + '</b><span class="mm">' + esc(nl.mm) + ' ' + L.fmtNum(need) + (unitMm(it) ? ' ' + esc(unitMm(it)) : '') + '</span></span></div>';
    }
    if (!cfg) {

  function multiHint(it, e) {

  // ย่อรูปในเครื่องก่อนส่ง (ด้านยาวสุด 1280px) — รูปมือถือ 3-5MB เหลือราว 150-300KB
  function resizeImage(file, maxSide, quality) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var s = Math.min(1, (maxSide || 1280) / Math.max(img.naturalWidth, img.naturalHeight));
        var c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res(c.toDataURL('image/jpeg', quality || 0.72));
      };
      img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('อ่านรูปไม่ได้ ลองรูปอื่น')); };
      img.src = url;
    });
  }

  // จำนวนที่นับครั้งก่อน (รอบที่ส่งรายงานแล้ว ก่อนวันนี้) — มาพร้อมข้อมูลบน Firebase ไม่ต้องเรียกหลังบ้าน
  function lastCountOf(it) { return S.boot && S.boot.lastCounts ? L.prevCount(S.boot.lastCounts, it.id, S.boot.date) : null; }
  function lastCountHtml(it) {

      '<span class="mm lc-mm">' + esc(tr('lastCount').mm) + (all ? ' (' + esc(all.mm) + ')' : '') + ': ' + esc(mm) + ' · ' + esc(when.mm) + '</span></div>';

  // ยอดรวมถ้าที่นี่นับได้ val (ของหลายที่: บวกที่อื่นที่นับแล้ว — ถ้าที่อื่นยังไม่ครบ ไม่เตือนสีแดง)
  function kpTotal(it, val) {
    if (!isMulti(it)) return val;
    var sum = val, ok = true;
    L.itemLocs(it).forEach(function (z) {
      if (z === S.kp.z) return;
      var e = slotVal(it, z);
      if (e && L.isNum(e.v)) sum += e.v; else ok = false;
    });
    return ok ? sum : Infinity;
  }

  function parseBuf(buf) {
    var n = Number(buf.replace(/\.$/, '') || 0);
    return isFinite(n) ? n : 0;
  }

  function openKp(id, from) {
    var it = itemById(id), z = S.screen === 'zone' && S.zone ? S.zone : it.zone;
    if (S.screen !== 'zone' && isMulti(it)) { var e = entry(id); if (e && e.missing && e.missing.length) z = e.missing[0]; }
    S.kp = { id: id, z: z, buf: '' };

    rerenderKeepScroll();
    var row = document.getElementById('r-' + id);
    if (row) row.scrollIntoView({ block: 'start', behavior: 'smooth' });

  function kpAdvance() {
    var cur = S.kp && S.kp.id;
    if (S.screen !== 'zone') { S.kp = null; rerenderKeepScroll(); return; }
    var list = zoneItems(S.zone);
    var idx = list.map(function (i) { return i.id; }).indexOf(cur);
    var next = null;
    for (var i = idx + 1; i < list.length; i++) {
      if (!S.onlyUncounted || !L.hasCount(slotVal(list[i], S.zone))) { next = list[i]; break; }
    }
    if (!next) {
      S.kp = null;
      rerenderKeepScroll();
      toast('✅ ' + tr('done').th + ' · ' + tr('done').mm);
      return;
    }
    openKp(next.id, 'zone');
  }

  // ---------- แจ้งเตือนสั้น / กล่องยืนยัน ----------
  function toast(text) {

  function confirmBox(titleHtml, bodyHtml, buttons) {

        '<div class="btn-row" style="margin-top:14px">' + buttons.map(function (b, i) {
          return '<button class="btn ' + (b.cls || 'btn-ghost') + ' stack" data-i="' + i + '">' + b.html + '</button>';
        }).join('') + '</div></div>';
      el.addEventListener('click', function (ev) {

  // กล่องพิมพ์ของแอพเอง — แทน window.prompt ที่เบราว์เซอร์ใน LINE/บางเครื่องปิดไว้ (กดแล้วเงียบ)
  function promptBox(title, placeholder) {
    return new Promise(function (res) {
      var el = document.createElement('div');
      el.className = 'modal';
      el.innerHTML = '<div class="card"><h3>' + esc(title) + '</h3><input class="inp" type="text" maxlength="40" autocomplete="off" placeholder="' + esc(placeholder || '') + '" style="margin-top:10px">' +
        '<div class="btn-row" style="margin-top:14px"><button class="btn btn-ghost" data-k="no">ยกเลิก</button><button class="btn btn-primary" data-k="ok">ตกลง</button></div></div>';
      var inp = el.querySelector('input');
      var done = function (v) { el.remove(); res(v); };
      el.addEventListener('click', function (ev) {
        var b = ev.target.closest('[data-k]');
        if (b) return done(b.dataset.k === 'ok' ? inp.value.trim() : null);
        if (ev.target === el) done(null);
      });
      inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); done(inp.value.trim()); } });
      document.body.appendChild(el);
      setTimeout(function () { inp.focus(); }, 50);
    });

  // ชื่อพม่าที่หัวหน้ายืนยัน/แก้: เปลี่ยนในเครื่องทันที แล้วรวมส่งเป็นชุด (กดหลายรายการติดกัน = ส่งครั้งเดียว)
  function mmSet(it, mm) {
    it.name_mm = mm; it.mm_auto = 'mon';
    (S.mmQ || (S.mmQ = {}))[it.id] = mm;
    clearTimeout(S.mmT); S.mmT = setTimeout(mmFlush, 4000);
    store.set('boot', { at: Date.now(), b: S.boot });
  }
  // ชื่อที่แก้แล้วแต่ยังส่งไม่ถึงหลังบ้าน → ทับข้อมูลที่เพิ่งมา (ไม่ให้เด้งกลับเป็นชื่อเก่า)
  function mmReapply() {
    var pend = {};
    outbox().forEach(function (j) { if (j.fn === 'apiStaffSetMm' && !j.failed) (j.args[2] || []).forEach(function (c) { pend[c.id] = c.mm; }); });
    Object.keys(S.mmQ || {}).forEach(function (id) { pend[id] = S.mmQ[id]; });
    if (!Object.keys(pend).length || !S.boot) return;
    (S.boot.items || []).forEach(function (it) { if (pend[it.id]) { it.name_mm = pend[it.id]; it.mm_auto = 'mon'; } });
  }
  function mmFlush() {
    clearTimeout(S.mmT);
    var q = S.mmQ || {}, ids = Object.keys(q);
    if (!ids.length) return;
    S.mmQ = {};
    outboxAdd('apiStaffSetMm', [S.pin, S.me, ids.map(function (id) { return { id: id, mm: q[id] }; })],
      '✏️ ' + tr('mmSavedN', { n: ids.length }).th + ' · ' + tr('mmSavedN', { n: ids.length }).mm);
  }

  // ---------- ส่งตามหลัง (outbox): กดยืนยันแล้วไปต่อได้เลย แอพส่งเองจนสำเร็จ — เก็บในเครื่อง เน็ตหลุด/ปิดแอพก็ไม่หาย (กฎ: ห้ามทำให้แอพช้าลง) ----------
  function outbox() { return S.outbox || (S.outbox = store.get('outbox') || []); }
  function outboxSave() { store.set('outbox', outbox()); }
  function outboxAdd(fn, args, label) {
    var job = { id: newRid(), fn: fn, args: args, label: label, at: Date.now(), tries: 0 };
    outbox().push(job);
    outboxSave();
    outboxRun();
    return job;
  }
  function outboxRun() {
    var q = outbox().filter(function (j) { return !j.failed; });
    outboxNet();
    if (S.outboxBusy || !q.length) return;
    var job = q[0];
    if (job.fn === 'apiSubmit' && (Object.keys(S.pending || {}).length || S.inflight)) {
      if (!S.inflight) flush();
      clearTimeout(S.outboxT); S.outboxT = setTimeout(outboxRun, 1500);
      return;
    }
    S.outboxBusy = true;
    apiRid(job.id, job.fn, job.args).then(function (res) {
      S.outbox = outbox().filter(function (j) { return j.id !== job.id; });
      outboxSave(); S.outboxBusy = false;
      outboxDone(job, res);
      outboxRun();
      if (['home', 'recv'].indexOf(S.screen) >= 0) rerenderKeepScroll();
    }, function (e) {
      S.outboxBusy = false;
      if (isNetErr(e)) {
        job.tries++; outboxSave();
        clearTimeout(S.outboxT);
        S.outboxT = setTimeout(outboxRun, Math.min(60000, 3000 * Math.pow(2, Math.min(job.tries, 5))));
      } else {
        job.failed = errMsg(e); outboxSave();
        toast('⚠️ ' + tr('outboxFailed').th + ' · ' + tr('outboxFailed').mm + ': ' + job.label);
        outboxRun();
      }
      outboxNet();
      if (['home', 'recv'].indexOf(S.screen) >= 0) rerenderKeepScroll();
    });
  }
  function outboxDone(job, res) {
    if (job.fn === 'apiReceive' && res && res.pos) { if (S.boot) S.boot.pos = res.pos; S.recvList = res.pos; }
    if (job.fn === 'apiSubmit' && res) {
      S.result = res;
      if (res.draft) applyServerDraft(res.draft);
      var st = String(res.status || '');
      if (!/(line|group)_ok/.test(st)) toast('⚠️ ' + (/email_ok/.test(st) ? 'LINE ส่งไม่ได้ — ส่งทางอีเมลบอสแทนแล้ว' : 'บันทึกแล้ว แต่แจ้งบอสไม่สำเร็จ — บอกบอสด้วย'));
    }
    toast('✅ ' + job.label + ' — ' + tr('sent').th + ' · ' + tr('sent').mm);
  }
  // จุดสถานะบนหัวจอ: ยังมีของค้างส่ง = กำลังบันทึก
  function outboxNet() {
    if (outbox().some(function (j) { return !j.failed; })) { if (S.net !== 'offline') setNet('saving'); }
    else if (S.net === 'saving' && !Object.keys(S.pending || {}).length && !S.inflight) setNet('ok');
  }
  function poSending(id) { return outbox().some(function (j) { return j.fn === 'apiReceive' && !j.failed && j.args[2] && String(j.args[2].po_id) === String(id); }); }
  function outboxHtml() {
    var q = outbox();
    if (!q.length) return '';
    var wait = q.filter(function (j) { return !j.failed; }), bad = q.filter(function (j) { return j.failed; });
    var net = wait.some(function (j) { return j.tries > 0; }); // เคยส่งไม่ผ่านเพราะเน็ต
    var h = !wait.length ? '' : '<div class="note info" style="margin-bottom:10px">' + (net ? '📤 ' + bi1('outboxWaiting', { n: wait.length })
      : '<span class="spin-sm"></span>' + bi1('sending') + ' (' + wait.length + ')') + '</div>';
    bad.forEach(function (j) {

  function numBox(titleHtml, def, unitHtml) {
    return new Promise(function (res) {
      var el = document.createElement('div');
      el.className = 'modal';
      el.innerHTML = '<div class="card"><h3>' + titleHtml + '</h3><div class="rqty" style="justify-content:center;margin-top:10px">' +
        '<input class="inp sm wide" type="number" inputmode="decimal" step="any" min="0" value="' + esc(def) + '"><span>' + (unitHtml || '') + '</span></div>' +
        '<div class="btn-row" style="margin-top:14px"><button class="btn btn-ghost stack" data-k="no">' + bi('cancel') + '</button><button class="btn btn-primary stack" data-k="ok">' + biIcon('✓', 'mmSave') + '</button></div></div>';
      var inp = el.querySelector('input');
      var done = function (v) { el.remove(); res(v); };
      el.addEventListener('click', function (ev) {
        var b = ev.target.closest('[data-k]');
        if (b) return done(b.dataset.k === 'ok' ? Number(inp.value) : null);
        if (ev.target === el) done(null);
      });
      inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); done(Number(inp.value)); } });
      document.body.appendChild(el);
      setTimeout(function () { inp.focus(); inp.select(); }, 50);
    });
  }

  var BIG_X = 3; // เกิน Max กี่เท่าถึงถาม
  function kpCheck(it, v) {
    if (!it) return Promise.resolve(true);
    var p = lastCountOf(it), last = p && L.isNum(p.v) && !isMulti(it) ? p.v : 0;
    var max = L.isConfigured(it) && it.max > 0 ? it.max : 0, base = Math.max(max, last);
    if (!base || !(v > base * BIG_X)) return Promise.resolve(true);
    var msg = last > max ? bi1('bigVsLast', { n: L.fmtNum(v), u: it.unit, um: unitMm(it) || it.unit, last: L.fmtNum(last) })
      : bi1('bigNumber', { n: L.fmtNum(v), u: it.unit, um: unitMm(it) || it.unit, max: L.fmtNum(max) });
    return confirmBox(msg, '',
      [{ key: 'fix', html: bi('fixIt') }, { key: 'ok', html: bi('yesCorrect'), cls: 'btn-primary' }]).then(function (k) { return k === 'ok'; });
  }
  // บันทึกตัวเลขในแป้น (ผ่านการเช็คแล้ว) → then(true) · ถ้าให้แก้ใหม่ = ล้างแป้นรอพิมพ์ใหม่ → then(false)
  function kpCommit() {
    var kp = S.kp, it = itemById(kp.id), v = parseBuf(kp.buf), key = kpKey();
    return kpCheck(it, v).then(function (ok) {
      if (ok) { setEntry(key, { v: v }); return true; }
      if (S.kp === kp) { kp.buf = ''; rerenderKeepScroll(); }
      return false;
    });
  }

  // รอให้ผลนับทั้งหมดขึ้นหลังบ้านก่อนส่ง (สูงสุด ~20 วินาที)
  function waitSaved() {
    return new Promise(function (res, rej) {
      var tries = 0;
      (function loop() {
        if (!S.inflight && !Object.keys(S.pending).length) return res();
        if (++tries > 40) return rej(new Error('network: ยังบันทึกไม่ขึ้น'));
        if (!S.inflight) flush();
        setTimeout(loop, 500);
      })();
    });
  }

      S.waste.q = el.value;
      var p = document.getElementById('waste-picks');
      if (p) p.innerHTML = wastePicks();
    },
    wasteQty: function (el) { S.waste.lines[+el.dataset.i].qty = el.value; wasteBtnUpdate(); },
    wasteNote: function (el) { S.waste.note = el.value; },
    recvQ: function (el) {
      S.recv.q = el.value;
      var p = document.getElementById('recv-picks');
      if (p) p.innerHTML = recvPicks();
    },
    recvQty: function (el) {
      var l = S.recv.lines[+el.dataset.k];
      l.qty = el.value;
      recvRowUpdate(+el.dataset.k);
    },
    // ของชั่ง: กรัมตามตาชั่ง → จำนวนในหน่วยที่สั่ง (+ ยอดนับถ้าหน่วยนับเป็นน้ำหนัก)
    recvGrams: function (el) {
      var l = S.recv.lines[+el.dataset.k], g = Number(el.value), cg = L.gramsPer(l.count_unit);
      l.grams = el.value;
      l.qty = g > 0 ? String(Math.round(g / l.g * 10000) / 10000) : '';
      if (l.factor !== 1 && cg) l.count = g > 0 ? String(L.round2(g / cg)) : '';
      recvRowUpdate(+el.dataset.k);
    },
    recvCount: function (el) { S.recv.lines[+el.dataset.k].count = el.value; },
    recvUnit: function (el) { S.recv.lines[+el.dataset.k].unit = el.value; },
    recvAmount: function (el) { S.recv.amount = el.value; },
    recvNote: function (el) { S.recv.note = el.value; },
    recvSupplier: function (el) { S.recv.supplier_name = el.value; },
    apinRemember: function (el) { S.apinRemember = el.checked; },
    photo: function (el) {
      var u = S[el.dataset.target], files = Array.prototype.slice.call(el.files || [], 0, 3 - u.photos.length);
      if (!files.length) return;
      u.busy = true; rerenderKeepScroll();
      files.reduce(function (p, f) {
        // เก็บไฟล์ต้นฉบับไว้ในเครื่อง (รับของ) — ตอนกดอ่านบิลค่อยทำรูปละเอียด ไม่ให้การส่งช้าลง
        return p.then(function () { return resizeImage(f).then(function (d) { u.photos.push(d); if (el.dataset.target === 'recv') (u.files = u.files || [])[u.photos.length - 1] = f; }); });
      }, Promise.resolve()).catch(function (e) { toast(errMsg(e)); }).then(function () { u.busy = false; rerenderKeepScroll(); });
    }
  };

  document.addEventListener('click', function (ev) {
    S.lastTouch = Date.now();
    var el = ev.target.closest('[data-act]');
    if (!el || el.disabled) return;

    if (f) { ev.preventDefault(); f(el, ev); }
  });
  document.addEventListener('input', function (ev) {

  // ================= หน้าบอส (ภาษาไทยอย่างเดียว) =================
  function loadAdmin(pin, tab) {
    return api('apiAdminLoad', pin, true).then(function (d) {
      useZones(d.zones);
      var prev = S.admin || {};
      d.orders = L.mergeOrders(prev.data && prev.data.orders, d.orders);
      S.admin = { pin: pin, data: d, tab: tab || prev.tab || 'dash', zone: prev.zone || ZONES[0].id, edit: null, staffDraft: null, lineMsg: '',
        dash: prev.dash || null, dashF: prev.dashF, dashQ: prev.dashQ };
      go('admin');
      adminTabLoad();
      loadExtras();
      adminCacheSave();
    });
  }
  function adminTabLoad() {
    if (S.admin.tab === 'po') loadPoData();
    if (S.admin.tab === 'dash') loadDash();
    if (S.admin.tab === 'history') loadReports();
  }
  // ประวัติรับของ/แจ้งด่วน/ค่า Claude — ไม่ต้องรอตอนเข้าหน้า
  function loadExtras() {
    var A = S.admin;
    return api('apiAdminExtras', A.pin).then(function (x) {
      if (S.admin !== A) return;
      A.data.receipts = x.receipts; A.data.alerts = x.alerts; A.data.settings.claudeUsage = x.claudeUsage;
      if (S.screen === 'admin' && (A.tab === 'history' || A.tab === 'settings')) rerenderKeepScroll();
    }, function () { /* ไว้โหลดใหม่ตอนเปิดแท็บ */ });
  }
  // เครื่องบอสที่จำรหัสไว้: จำข้อมูลหน้าบอสไว้ด้วย → ครั้งหน้าเปิดได้ทันที แล้วค่อยอัปเดตตามหลัง
  function adminCacheSave() {
    var A = S.admin;
    if (!A || !store.get('apin')) return;
    store.set('adminCache', { at: Date.now(), d: { items: A.data.items, staff: A.data.staff, zones: A.data.zones, settings: A.data.settings, recipes: A.data.recipes, orders: A.data.orders }, dash: A.dash || null,
      po: A.po || null, rep: A.rep && A.rep.list && A.rep.list.length ? { list: A.rep.list.slice(0, 40), more: A.rep.more } : null });
  }
  function adminFromCache(ap) {
    var c = store.get('adminCache');
    if (!c || !c.d || !c.d.items || Date.now() - (c.at || 0) > 3 * 86400000) return false;
    useZones(c.d.zones);
    S.admin = { pin: ap, data: c.d, tab: 'dash', zone: ZONES[0].id, edit: null, staffDraft: null, lineMsg: '', dash: c.dash || null, stale: true,
      po: c.po || null, rep: c.rep ? { list: c.rep.list, more: c.rep.more } : undefined };
    go('admin');
    var A = S.admin;
    api('apiAdminLoad', ap, true).then(function (d) {
      if (S.admin !== A) return;
      useZones(d.zones);
      d.receipts = A.data.receipts; d.alerts = A.data.alerts;
      if (A.data.settings && A.data.settings.claudeUsage) d.settings.claudeUsage = A.data.settings.claudeUsage;
      d.orders = L.mergeOrders(A.data.orders, d.orders);
      A.data = d; A.stale = false;
      if (S.screen === 'admin' && !A.staffDraft && !A.move) rerenderKeepScroll();
      adminTabLoad();
      loadExtras();
      adminCacheSave();
    }, function (e) {
      if (S.admin !== A) return;
      if (/BAD_PIN/.test(errMsg(e))) { store.del('apin'); store.del('adminCache'); S.admin = null; S.pinBuf = ''; S.pinMsg = ''; return go('adminpin'); }
      A.stale = false; rerenderKeepScroll();
      toast(isNetErr(e) ? tr('offline').th : errMsg(e));
    });
    return true;
  }

  // ================= สั่งซื้อ (หน้าบอส) =================
  function loadPoData() {
    return api('apiAdminPoData', S.admin.pin).then(function (d) {
      S.admin.po = d;
      adminCacheSave();
      if (S.screen === 'admin') rerenderKeepScroll();

  // ใบสั่งใหม่ (ใบเปล่า/วางรายการ) นับเป็นของรอบนับล่าสุด → ของในใบนั้นไม่ขึ้นซ้ำตอนสร้างใบจากรอบนี้
  function roundDate() { var P = S.admin && S.admin.po; return (P && P.round && P.round.date) || ''; }
  // บันทึกใบสั่งแล้ว ติดป้าย "สั่งแล้ว" ในรายการรอบนี้ทันที ไม่ต้องรอโหลดใหม่ (กดสร้างใบร้านถัดไปได้เลย ของไม่ขึ้นซ้ำ)
  function markOrdered(po) {
    var P = S.admin && S.admin.po;
    if (!po || !P || !P.round || String(po.source_date || '').slice(0, 10) !== P.round.date) return;
    var keys = {};
    po.lines.forEach(function (l) { if (l.qty > 0) keys[l.key] = true; });
    P.round.lines.forEach(function (l) { if (keys[l.key]) l.ordered_in = '#' + po.id; });
    adminCacheSave();
  }

  var PO_TAG = { open: 'brand', partial: 'warn', received: 'ok', closed: '' };
  function poStatusTag(st) { return '<span class="tag ' + (PO_TAG[st] || '') + '">' + esc(L.PO_STATUS_TH[st] || st) + '</span>'; }

    var rnd = P.round, notYet = rnd.lines.filter(function (l) { return !l.ordered_in; });
    h += '<div class="card" style="padding:16px"><b>🧾 รอบนับล่าสุด: ' + esc(L.thaiDate(rnd.date)) + (rnd.submitted ? '' : ' (ยังไม่ได้กดส่ง)') + '</b>' +
      '<div class="muted" style="margin-top:4px">ต้องซื้อ ' + rnd.lines.length + ' รายการ · สั่งแล้ว ' + (rnd.lines.length - notYet.length) + ' · ยังไม่สั่ง ' + notYet.length + '</div>' +
      '<div class="btn-row" style="margin-top:12px"><button class="btn btn-primary" data-act="poFromRound"' + (notYet.length ? '' : ' disabled') + '>🛒 สร้างใบสั่งจากรอบนี้</button>' +
      '<button class="btn btn-ghost" data-act="poBlank">＋ ใบสั่งเปล่า</button></div>' +
      '<button class="btn btn-ghost" style="margin-top:10px" data-act="impOpen">📋 วางรายการสั่งซื้อ (หลายร้านทีเดียว)</button>' +
      '<p class="muted" style="margin:10px 0 0;font-size:13.5px">ของหลายร้าน: ติ๊กเฉพาะของร้านแรก → บันทึก → กดสร้างอีกใบสำหรับร้านถัดไป (ของที่สั่งแล้วจะไม่ขึ้นซ้ำ)</p></div>';

    if (A.supDraft) {
      h += '<div class="list">' + A.supDraft.map(function (x, i) {
        return '<div class="card staff-row" style="grid-template-columns:1fr 44px"><input type="text" class="inp" style="height:46px" data-input="supName" data-i="' + i + '" value="' + esc(x.name) + '" placeholder="ชื่อร้าน">' +
          '<label class="check" title="ใช้งาน"><input type="checkbox" data-input="supActive" data-i="' + i + '"' + (x.active !== false ? ' checked' : '') + '></label></div>';
      }).join('') + '</div><div class="btn-row" style="margin-top:10px"><button class="btn btn-ghost" data-act="supAdd">＋ เพิ่มร้าน</button><button class="btn btn-primary" data-act="supSave">บันทึกร้านค้า</button></div>';
    } else {

        '<div class="muted" style="font-size:13px">' + poDateTh(po.created_at) + ' · ' + lines.length + ' รายการ · รับแล้ว ' + got + '/' + lines.length + '</div></div></button>';
    }).join('') + '</div>' : '<p class="muted">ยังไม่มีใบสั่ง</p>';

  // ---------- วางรายการสั่งซื้อเป็นข้อความ → หลายใบสั่งทีเดียว ----------
  function impVendor(v) {
    var sups = (S.admin.po && S.admin.po.suppliers || []).filter(function (x) { return x.active !== false; });
    if (!v || /^(ไม่ระบุ|-|ไม่มี)$/.test(v.trim())) return '';
    var best = null, sc = 0;
    sups.forEach(function (x) { var t = L.nameScore(v, x.name); if (t > sc) { sc = t; best = x; } });
    return best && sc >= 0.5 ? best.id : 'new:' + v.trim();
  }
  function impParse() {
    var I = S.admin.imp, items = S.admin.data.items.filter(function (it) { return it.active !== false; });
    I.blocks = L.parseOrderText(I.text).map(function (b) {
      return { vendor: b.vendor, supplier: impVendor(b.vendor), lines: b.lines.map(function (l) {
        var m = L.matchItemName(l.name, items);
        return { name: l.name, qty: l.qty, unit: l.unit, item_id: m.item ? m.item.id : '', include: l.qty > 0 };
      }) };
    });
  }
  function impItem(id) { return S.admin.data.items.filter(function (x) { return x.id === id; })[0] || null; }
  function impLine(l) { return L.poLineFromOrder({ name: l.name, qty: Number(l.qty), unit: l.unit }, impItem(l.item_id), UNITS); }

  function poImportScreen() {
    var I = S.admin.imp, h = top({ th: '📋 วางรายการสั่งซื้อ', back: 'impBack', net: false }) + '<div class="wrap screen">';
    if (I.results) {
      h += '<div class="note ok">✅ สร้างใบสั่ง ' + I.results.length + ' ใบแล้ว</div><div class="list" style="margin-top:12px">' + I.results.map(function (r, i) {
        return '<div class="card" style="padding:14px 16px"><div class="dr-top"><b>#' + r.po.id + ' ' + esc(r.po.supplier_name || 'ไม่ระบุร้าน') + '</b><span class="muted">' + r.po.lines.length + ' รายการ</span></div>' +
          '<div class="btn-row" style="margin-top:10px"><button class="btn btn-primary" data-act="impCopy" data-i="' + i + '">📋 คัดลอกไปส่งร้าน</button><button class="btn btn-ghost" data-act="poOpen" data-id="' + r.po.id + '">เปิดใบสั่ง</button></div></div>';
      }).join('') + '</div></div><div class="bottom"><div class="wrap"><button class="btn btn-ghost" data-act="impDone">เสร็จ</button></div></div>';
      return h;
    }
    if (!I.blocks) {
      return h + '<p class="sub">วางข้อความรายการสั่งซื้อ แยกร้านด้วยบรรทัด <b>ผู้ขาย: ชื่อร้าน</b> แต่ละบรรทัด <b>ชื่อ จำนวน หน่วย</b></p>' +
        '<textarea id="imp-text" data-input="impText" rows="14" style="width:100%;font-size:15px" placeholder="ผู้ขาย: พี่แหลม&#10;พริกจินดาแดง 1 กก.&#10;กระเทียมจีน 1.5 กก.&#10;&#10;ผู้ขาย: ตลาดแกรนด์&#10;มะเขือเทศ 1 กก.">' + esc(I.text || '') + '</textarea>' +
        '</div><div class="bottom"><div class="wrap"><button class="btn btn-primary" data-act="impParse">แยกรายการ ›</button></div></div>';
    }
    var sups = (S.admin.po && S.admin.po.suppliers || []).filter(function (x) { return x.active !== false; });
    var itemOpts = S.admin.data.items.filter(function (it) { return it.active !== false; }).slice().sort(function (a, b) { return a.name_th.localeCompare(b.name_th, 'th'); });
    var nPo = 0, nLine = 0;
    h += '<p class="sub">ตรวจว่าแต่ละบรรทัดจับคู่ถูกรายการ (เปลี่ยนได้) แล้วกดสร้าง · ไม่ติ๊ก = ไม่ใส่ในใบสั่ง</p>';
    h += I.blocks.map(function (b, bi) {
      var inc = b.lines.filter(function (l) { return l.include && Number(l.qty) > 0; }).length;
      if (inc) { nPo++; nLine += inc; }
      var opts = '<option value="">— ไม่ระบุร้าน —</option>' + sups.map(function (x) { return '<option value="' + esc(x.id) + '"' + (b.supplier === x.id ? ' selected' : '') + '>' + esc(x.name) + '</option>'; }).join('') +
        (b.supplier.indexOf('new:') === 0 ? '<option value="' + esc(b.supplier) + '" selected>＋ เพิ่มร้านใหม่: ' + esc(b.supplier.slice(4)) + '</option>' : '');
      return '<div class="card imp-block"><div class="imp-head"><span class="muted" style="font-size:13px">ผู้ขาย: ' + esc(b.vendor || '(ไม่ได้ระบุ)') + '</span>' +

          return '<div class="imp-line' + (l.include ? '' : ' off') + '"><label class="check"><input type="checkbox" data-input="impInc" data-b="' + bi + '" data-l="' + li + '"' + (l.include ? ' checked' : '') + '></label>' +
            '<div class="nm"><b>' + esc(l.name) + '</b>' +
            '<select class="imp-item" data-input="impItem" data-b="' + bi + '" data-l="' + li + '"><option value="">➕ ของนอกรายการ (ชื่อตามที่พิมพ์)</option>' +
            itemOpts.map(function (x) { return '<option value="' + esc(x.id) + '"' + (x.id === l.item_id ? ' selected' : '') + '>' + esc(x.name_th) + (x.kind === 'prep' ? ' 🔪' : '') + ' (' + esc(x.unit || '-') + ')</option>'; }).join('') + '</select>' +
            (conv ? '<small class="muted">' + conv + '</small>' : '') + (warn ? '<small style="color:var(--warn)">' + warn + '</small>' : '') + '</div>' +
            '<div class="imp-q"><input type="number" inputmode="decimal" step="any" min="0" class="inp sm" data-input="impQty" data-b="' + bi + '" data-l="' + li + '" value="' + (l.qty === null ? '' : esc(String(l.qty))) + '"><span>' + esc(l.unit) + '</span></div></div>';
        }).join('') + '</div>';
    }).join('');
    h += '</div><div class="bottom"><div class="wrap"><div class="btn-row"><button class="btn btn-ghost" data-act="impEdit">แก้ข้อความ</button>' +
      '<button class="btn btn-primary" data-act="impSave"' + (nPo && !I.saving ? '' : ' disabled') + '>' + (I.saving ? 'กำลังสร้าง…' : 'สร้าง ' + nPo + ' ใบสั่ง (' + nLine + ' รายการ)') + '</button></div></div></div>';
    return h;
  }

      var got = l.received > 0;
      return '<div class="card pe-line' + (l.include ? '' : ' off') + '"><label class="check"><input type="checkbox" data-input="peInc" data-i="' + i + '"' + (l.include ? ' checked' : '') + (got ? ' disabled' : '') + '></label>' +
        '<div class="nm"><b>' + esc(l.name_th) + '</b>' + (l.for_item ? '<small class="muted">🧾 สูตร ' + esc(l.for_item) + '</small>' : '') + (l.left !== undefined && l.left !== null ? '<small class="muted">เหลือ ' + L.fmtNum(l.left) + ' · Min ' + L.fmtNum(l.min) + ' · Max ' + L.fmtNum(l.max) + (l.factor !== 1 ? ' (' + esc(l.count_unit) + ')' : '') + '</small>' : '') +
        (got ? '<small style="color:var(--ok)">รับแล้ว ' + L.fmtNum(l.received) + ' ' + esc(l.unit) + ' — เอาออกไม่ได้ (ถ้ารับผิดให้แก้ที่ใบรับ)</small>' : '') + '</div>' +
        '<div class="pe-q"><input type="number" inputmode="decimal" step="any" min="0" class="inp sm" data-input="peQty" data-i="' + i + '" value="' + esc(l.qty) + '">' +
        (l.item_id ? '<span>' + esc(l.unit) + (l.size ? ' (' + esc(l.size) + ')' : '') + '</span>' : '<input type="text" class="inp sm" style="width:64px" data-input="peUnit" data-i="' + i + '" value="' + esc(l.unit) + '" placeholder="หน่วย">') + approx + '</div>' +
        (l.added ? '<button class="mini-x" data-act="peDel" data-i="' + i + '" aria-label="ลบ">✕</button>' : '') + '</div>';
    }).join('') + '</div>';
    h += '<div class="field"><label>＋ เพิ่มรายการ</label><input class="inp" id="pe-q" data-input="peQ" autocomplete="off" placeholder="🔍 ค้นหาของ" value="' + esc(E.q || '') + '"><div class="picks" id="pe-picks">' + pePicks() + '</div></div>';
    h += '<div class="field"><label>หมายเหตุถึงร้าน (ถ้ามี)</label><textarea data-input="peNote" maxlength="300">' + esc(E.note || '') + '</textarea></div>';
    var n = E.lines.filter(function (l) { return l.include && Number(l.qty) > 0; }).length;
    h += '</div><div class="bottom"><div class="wrap"><button class="btn btn-primary" data-act="peSave" id="pe-save"' + (E.saving ? ' disabled' : '') + '>' + (E.saving ? 'กำลังบันทึก…' : '💾 บันทึกใบสั่ง (' + n + ' รายการ)') + '</button></div></div>';
    return h;
  }

  function pePicks() {
    var q = (S.admin.poEdit.q || '').trim().toLowerCase();
    if (!q) return '';
    var list = S.admin.data.items.filter(function (it) { return it.active !== false && (matchItem(it, q)); })
      .sort(function (a, b) { return (a.kind === 'buy' ? 0 : 1) - (b.kind === 'buy' ? 0 : 1); }).slice(0, 8);
    return list.map(function (it) { return '<button data-act="pePick" data-id="' + esc(it.id) + '">' + esc(it.name_th) + '</button>'; }).join('') +
      '<button data-act="pePickText">✍️ ของนอกรายการ: "' + esc(S.admin.poEdit.q) + '"</button>';
  }

  function poDetailScreen() {
    var V = S.admin.poView, po = V.po;
    var h = top({ th: 'ใบสั่ง #' + po.id, back: 'poDetailBack', net: false }) + '<div class="wrap screen">';
    h += '<div class="card po-head"><div class="po-no">#' + po.id + '</div><div><b>' + esc(po.supplier_name || 'ไม่ระบุร้าน') + '</b> ' + poStatusTag(po.status) +
      '<div class="muted" style="font-size:13px">สร้าง ' + poDateTh(po.created_at) + (po.source_date ? ' · จากรอบนับ ' + esc(L.thaiDate(po.source_date)) : '') + '</div></div></div>';
    var closed = po.status === 'closed';
    h += '<div class="card sum-list" style="margin-top:12px">' + po.lines.map(function (l) {
      var rem = Math.max(0, L.round2(l.qty - (l.received || 0))), done = L.lineDone(l), v = L.varianceText(l);
      var st = !l.qty ? '' : !done ? ' · <span style="color:var(--bad)">ค้าง ' + L.fmtNum(rem) + '</span>' : v ? ' · ' + esc(v) : ' ✓';
      var btn = closed || !l.qty ? '' : !done ? '<button class="mini-link" data-act="poLineDone" data-k="' + esc(l.key) + '" data-v="1">⛔ ไม่รอแล้ว</button>'
        : l.done && rem ? '<button class="mini-link" data-act="poLineDone" data-k="' + esc(l.key) + '" data-v="0">↩️ เปลี่ยนเป็นยังรอ</button>' : '';
      return '<div class="sum-row"><div class="nm"><b>' + esc(l.name_th) + '</b>' + (l.order_name ? '<small class="muted">สั่งว่า: ' + esc(l.order_name) + '</small>' : '') + (l.extra ? '<small class="muted">มาเกินใบสั่ง</small>' : '') + '</div><div class="q">' +
        (l.qty ? '<small>สั่ง</small> <b>' + L.fmtNum(l.qty) + ' ' + esc(l.unit) + '</b>' : '') +
        '<small style="display:block">รับแล้ว ' + L.fmtNum(l.received || 0) + st + '</small>' + btn + '</div></div>';
    }).join('') + '</div>';
    h += '<div class="btn-row" style="margin-top:12px"><button class="btn btn-primary" data-act="poCopy">📋 คัดลอกไปส่งร้าน</button>' +
      (closed ? '<button class="btn btn-ghost" data-act="poReopen">↩️ เปิดใบสั่งอีกครั้ง</button>' : '<button class="btn btn-ghost" data-act="poEditOpen">✏️ แก้ใบสั่ง</button>') + '</div>';
    if (po.status === 'open' || po.status === 'partial') h += '<button class="btn btn-danger" style="margin-top:10px" data-act="poClose">⛔ ปิดใบสั่ง (ของที่ค้างไม่มาแล้ว)</button>';
    h += '<div class="section-h">ข้อความที่จะคัดลอก</div><div class="preview">' + esc(V.text) + '</div>';
    h += '<div class="section-h">📦 การรับของ (' + V.receipts.length + ')</div>';
    h += V.receipts.length ? '<div class="list">' + V.receipts.map(receiptCard).join('') + '</div>' : '<p class="muted">ยังไม่มีใครกดรับ</p>';
    return h + '</div>';
  }

  // การ์ดใบรับของในหน้าบอส (รายละเอียดใบสั่ง + ประวัติ) — แก้/ยกเลิกได้
  function receiptCard(r) {
    var voided = r.status === 'void';
    return '<div class="card hist"' + (voided ? ' style="opacity:.6"' : '') + '><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><b>' + esc(r.id) + ' · ' + esc(r.by) + ' · ' + poDateTh(r.at) + ' ' + esc(L.bkkTime(r.at)) + '</b>' +
      (r.amount ? '<span class="tag">💵 ' + Number(r.amount).toLocaleString('en-US') + ' บาท</span>' : '') + '</div>' +
      (r.po_id || r.supplier_name ? '<div class="muted" style="font-size:13.5px">' + (r.po_id ? 'ใบสั่ง #' + esc(r.po_id) + ' · ' : 'ไม่มีใบสั่ง · ') + esc(r.supplier_name || 'ไม่ระบุร้าน') + '</div>' : '') +
      '<div class="muted" style="font-size:14px' + (voided ? ';text-decoration:line-through' : '') + '">' + r.lines.map(function (l) {
        return esc(l.name_th) + ' ' + L.fmtNum(l.qty) + ' ' + esc(l.unit) + (l.count ? ' (นับได้ ' + L.fmtNum(l.count) + ')' : '') + (l.done ? ' ✓ถือว่าครบ' : '');
      }).join(' · ') + '</div>' +
      (r.note ? '<div class="muted">📝 ' + esc(r.note_th || r.note) + '</div>' : '') +
      (r.edit_log ? '<div class="muted" style="font-size:13px;white-space:pre-line">' + (voided ? '🗑️ ' : '✏️ ') + esc(r.edit_log) + '</div>' : '') +
      '<div class="picks">' + (r.photos ? String(r.photos).split(',').filter(Boolean).map(function (id, k) { return '<button data-act="aPhoto" data-id="' + esc(id) + '">📷 ดูรูป ' + (k + 1) + '</button>'; }).join('') : '') +
      (voided ? '<span class="tag bad">ยกเลิกแล้ว</span>' : '<button data-act="aRecvEdit" data-id="' + esc(r.id) + '">✏️ แก้ / ยกเลิก</button>') + '</div></div>';
  }

  // ================= แดชบอร์ด (หน้าบอส) — กราฟวาดเองด้วย SVG ไม่ต้องโหลดไลบรารี =================
  var ST = {
    low: { th: 'ต่ำกว่า Min', c: 'var(--bad)', tag: 'bad' },
    near: { th: 'ใกล้ Min', c: 'var(--warn)', tag: 'warn' },
    ok: { th: 'พอดี', c: 'var(--ok)', tag: 'ok' },
    over: { th: 'เกิน Max', c: '#3b6fb6', tag: 'brand' },
    unknown: { th: 'ยังไม่รู้', c: '#c9c3bb', tag: '' }
  };

  function loadDash() {
    S.admin.dashErr = '';
    return api('apiAdminDashboard', S.admin.pin).then(function (d) {
      S.admin.dash = d;
      adminCacheSave();
      if (S.screen === 'admin' || S.screen === 'adash') rerenderKeepScroll();
    }, function (e) { S.admin.dashErr = errMsg(e); if (S.screen === 'admin') rerenderKeepScroll(); });
  }

  function dashFiltered() {
    var A = S.admin, f = A.dashF || 'all', q = (A.dashQ || '').trim().toLowerCase();
    return A.dash.items.filter(function (r) {
      if (q && r.name_th.toLowerCase().indexOf(q) < 0) return false;
      if (f === 'all') return true;
      if (f === 'attn') return r.status === 'low' || (r.runsOutIn !== null && r.runsOutIn <= 2);
      if (f === 'soon') return r.runsOutIn !== null && r.runsOutIn <= 1;
      if (ST[f]) return r.status === f;
      return r.zone === f;
    });
  }

  function shortDate(d) { return L.thaiDate(d).split(' ').slice(1, 3).join(' '); }
  function qtyText(q, unit) { return q === null || q === undefined ? '–' : L.fmtNum(q) + ' ' + unit; }
  function dashItemById(id) { return S.admin.dash.items.filter(function (r) { return r.id === id; })[0]; }

  // แถบระดับของ: 0 ── Min ── Max  (สีตามสถานะ)
  function gauge(r) {
    var q = r.estNow;
    if (q === null || !r.configured) return '<div class="gauge empty"></div>';
    var scale = Math.max(r.max * 1.25, q, 1e-9), pct = function (v) { return Math.max(0, Math.min(100, v / scale * 100)); };
    return '<div class="gauge"><i style="width:' + pct(q) + '%;background:' + ST[r.status].c + '"></i>' +
      '<b class="gk" style="left:' + pct(r.min) + '%"></b><b class="gk mx" style="left:' + pct(r.max) + '%"></b></div>';
  }

  function dashRow(r) {
    var meta = [];
    if (r.last) meta.push((r.last.draft ? 'นับวันนี้ (ยังไม่ส่ง)' : 'นับ ' + shortDate(r.last.date)));
    if (r.recvSince) meta.push('+' + L.fmtNum(r.recvSince) + ' รับเข้า');
    if (r.daysCover !== null) meta.push('พอใช้ ~' + L.fmtNum(Math.round(r.daysCover * 10) / 10) + ' วัน');
    if (r.onOrder) meta.push('สั่งแล้ว ' + L.fmtNum(r.onOrder));
    var val = r.estNow !== null ? qtyText(r.estNow, r.unit) : r.last && r.last.level ? L.LEVEL_TH[r.last.level] || r.last.level : 'ยังไม่นับ';
    return '<button class="card dash-row" data-act="dashItem" data-id="' + esc(r.id) + '"><div class="dr-top"><span class="nm">' + esc(zoneOf(r.zone).icon) + ' ' + esc(r.name_th) + '</span>' +
      '<b style="color:' + (r.status === 'unknown' ? 'var(--muted)' : ST[r.status].c) + '">' + esc(val) + '</b></div>' + gauge(r) +
      '<small class="muted">' + (r.configured ? 'Min ' + L.fmtNum(r.min) + ' · Max ' + L.fmtNum(r.max) + (meta.length ? ' · ' : '') : '') + esc(meta.join(' · ')) + '</small></button>';
  }

  // กราฟระดับของ: เส้นที่นับจริง + แถบ Min–Max + ของเข้า ▲ + คาดการณ์ (เส้นประ)
  function stockChart(r) {
    var W = 340, H = 180, pl = 40, pr = 12, pt = 14, pb = 28;
    var pts = r.series.slice(), fc = r.forecast || [];
    var start = pts.length ? pts[0].d : L.addDays(S.admin.dash.today, -13);
    var end = fc.length ? fc[fc.length - 1].date : S.admin.dash.today;
    if (end < start) end = start;
    var span = Math.max(1, L.dayDiff(start, end));
    var vals = pts.map(function (p) { return p.q; }).concat(fc.map(function (f) { return f.stock; }), [r.estNow || 0]);
    if (r.configured) vals.push(r.max * 1.15);
    var yMax = Math.max.apply(null, vals.concat([1]));
    var x = function (d) { return pl + L.dayDiff(start, d) / span * (W - pl - pr); };
    var y = function (v) { return pt + (1 - v / yMax) * (H - pt - pb); };
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart" role="img" aria-label="กราฟระดับของ">';
    if (r.configured) {
      s += '<rect x="' + pl + '" y="' + y(r.max) + '" width="' + (W - pl - pr) + '" height="' + Math.max(0, y(r.min) - y(r.max)) + '" fill="var(--ok-soft)"/>' +
        '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(r.min) + '" y2="' + y(r.min) + '" stroke="var(--warn)" stroke-dasharray="4 3"/>' +
        '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(r.max) + '" y2="' + y(r.max) + '" stroke="var(--ok)" stroke-dasharray="4 3"/>' +
        '<text x="' + (W - pr - 2) + '" y="' + (y(r.min) - 4) + '" text-anchor="end" class="cl" fill="var(--warn)">Min ' + L.fmtNum(r.min) + '</text>' +
        '<text x="' + (W - pr - 2) + '" y="' + (y(r.max) - 4) + '" text-anchor="end" class="cl" fill="var(--ok)">Max ' + L.fmtNum(r.max) + '</text>';
    }
    s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="var(--line)"/>' +
      '<text x="' + (pl - 6) + '" y="' + (y(0) + 4) + '" text-anchor="end" class="cl">0</text>' +
      '<text x="' + (pl - 6) + '" y="' + (y(yMax) + 8) + '" text-anchor="end" class="cl">' + L.fmtNum(Math.round(yMax)) + '</text>';
    (r.recv || []).forEach(function (v) {
      if (v.d < start) return;
      var cx = x(v.d), by = H - pb + 2;
      s += '<path d="M' + (cx - 5) + ' ' + by + ' L' + cx + ' ' + (by - 8) + ' L' + (cx + 5) + ' ' + by + ' Z" fill="var(--brand)"><title>รับเข้า ' + esc(shortDate(v.d)) + ': +' + L.fmtNum(v.q) + '</title></path>';
    });
    if (fc.length && r.estNow !== null) {
      s += '<polyline fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4" points="' +
        [x(L.addDays(S.admin.dash.today, -1)) + ',' + y(r.estNow)].concat(fc.map(function (f) { return x(f.date) + ',' + y(f.stock); })).join(' ') + '"/>';
    }
    if (pts.length) {
      s += '<polyline fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round" points="' + pts.map(function (p) { return x(p.d) + ',' + y(p.q); }).join(' ') + '"/>';
      pts.forEach(function (p, i) {
        s += '<circle cx="' + x(p.d) + '" cy="' + y(p.q) + '" r="' + (i === pts.length - 1 ? 4.5 : 2.5) + '" fill="var(--brand)"><title>' + esc(shortDate(p.d)) + ': ' + L.fmtNum(p.q) + ' ' + esc(r.unit) + '</title></circle>';
      });
    }
    var mid = L.addDays(start, Math.round(span / 2));
    [[start, 'start'], [mid, 'middle'], [end, 'end']].forEach(function (t) {
      s += '<text x="' + Math.min(W - pr, Math.max(pl, x(t[0]))) + '" y="' + (H - 6) + '" text-anchor="' + t[1] + '" class="cl">' + esc(shortDate(t[0])) + '</text>';
    });
    return s + '</svg>';
  }

  // กราฟแท่ง: [{label, v, c, title}] + เส้นค่าเฉลี่ย (ถ้ามี)
  function barChart(bars, opt) {
    opt = opt || {};
    var W = 340, H = opt.h || 150, pl = 34, pr = 8, pt = 12, pb = 24;
    var mx = Math.max.apply(null, bars.map(function (b) { return b.v || 0; }).concat([opt.avg || 0, opt.max || 0, 1e-9]));
    var bw = (W - pl - pr) / Math.max(1, bars.length);
    var y = function (v) { return pt + (1 - v / mx) * (H - pt - pb); };
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart" role="img">' +
      '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="var(--line)"/>' +
      '<text x="' + (pl - 5) + '" y="' + (y(mx) + 8) + '" text-anchor="end" class="cl">' + L.fmtNum(Math.round(mx * 10) / 10) + '</text>';
    var every = Math.ceil(bars.length / 8);
    bars.forEach(function (b, i) {
      var bx = pl + i * bw + bw * 0.15, h = Math.max(b.v ? 1 : 0, y(0) - y(b.v || 0));
      s += '<rect x="' + bx + '" y="' + (y(0) - h) + '" width="' + bw * 0.7 + '" height="' + h + '" rx="3" fill="' + (b.c || 'var(--brand)') + '"><title>' + esc(b.title || (b.label + ': ' + L.fmtNum(b.v))) + '</title></rect>';
      if (i % every === 0 || i === bars.length - 1) s += '<text x="' + (bx + bw * 0.35) + '" y="' + (H - 7) + '" text-anchor="middle" class="cl">' + esc(b.label) + '</text>';
    });
    if (opt.avg) {
      s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(opt.avg) + '" y2="' + y(opt.avg) + '" stroke="var(--ink)" stroke-dasharray="4 3"/>' +
        '<text x="' + (pl + 3) + '" y="' + (y(opt.avg) - 5) + '" class="cl halo" fill="var(--ink)">เฉลี่ย ' + L.fmtNum(opt.avg) + '</text>';
    }
    return s + '</svg>';
  }

  function dashTab() {
    var A = S.admin, D = A.dash, h = '';
    if (A.dashErr && !D) return '<div class="note bad">' + esc(A.dashErr) + '</div><button class="btn btn-ghost" style="margin-top:12px" data-act="dashReload">ลองใหม่</button>';
    if (!D) return '<p class="muted center" style="margin-top:24px"><span class="spin-sm"></span>กำลังคำนวณ…</p>';
    var items = D.items, ready = D.ready;
    h += '<div class="dash-head"><span class="muted">ข้อมูล ณ ' + esc(L.thaiDate(D.today)) + '</span><button class="mini-link" data-act="dashReload">↻ โหลดใหม่</button></div>';
    var V = A.dashView || 'overview', sugN = items.filter(function (r) { return r.suggest && r.suggest.differs; }).length;
    h += '<div class="seg dash-seg">' + [['overview', '📊 ภาพรวม'], ['stock', '📦 สต็อค'], ['minmax', '🧮 Min/Max' + (sugN ? ' (' + sugN + ')' : '')]].map(function (v) {
      return '<button class="' + (V === v[0] ? 'on' : '') + '" data-act="dashView" data-v="' + v[0] + '">' + v[1] + '</button>';
    }).join('') + '</div>';
    if (V === 'stock') return h + dashStockView();
    if (V === 'minmax') return h + dashMinMaxView();
    if (ready < D.eligible * 0.8) {
      h += '<div class="note info" style="margin:12px 0">📈 มีข้อมูลรอบนับ <b>' + D.dataDays + ' วัน</b> · อัตราใช้ คาดการณ์ และ Min/Max ที่แนะนำ จะขึ้นเมื่อรายการนั้นนับเป็นตัวเลขต่อเนื่องครบ ' + D.minDays + ' วัน (ตอนนี้พร้อม ' + ready + ' จาก ' + D.eligible + ' รายการของซื้อ) — ยิ่งทีมนับครบทุกรายการทุกวัน ตัวเลขยิ่งแม่น</div>';
    }
    var lastCov = D.coverage.length ? D.coverage[D.coverage.length - 1] : null;
    h += '<div class="kpis" style="margin-top:12px">' +
      kpi(D.status.low, 'ต่ำกว่า Min', 'bad', 'dashFilter', 'low') +
      kpi(ready ? D.soon : '–', 'จะหมดใน 2 วัน', 'warn', 'dashFilter', 'soon', ready ? '' : 'รอข้อมูล') +
      kpi(D.openPos, 'ใบสั่งรอรับ', 'brand', 'dashToPo', '') +
      kpi(lastCov ? lastCov.n + '/' + D.total : '–', 'นับล่าสุด', '', '', '', lastCov ? shortDate(lastCov.date) : '') + '</div>';
    // สุขภาพสต็อค
    var segs = ['low', 'near', 'ok', 'over', 'unknown'].filter(function (k) { return D.status[k]; });
    h += '<div class="card" style="padding:14px 16px;margin-top:12px"><b>สุขภาพสต็อค</b><div class="stack-bar">' + segs.map(function (k) {
      return '<i style="flex:' + D.status[k] + ';background:' + ST[k].c + '" title="' + ST[k].th + '"></i>';
    }).join('') + '</div><div class="legend">' + segs.map(function (k) {
      return '<button data-act="dashFilter" data-v="' + k + '"><i style="background:' + ST[k].c + '"></i>' + ST[k].th + ' <b>' + D.status[k] + '</b></button>';

          '<div>' + esc({ runout: '⏳ จะหมดก่อนพีค', spoiled: '🗑️ ของเสีย/หมดอายุ', other: '📣 อื่นๆ', waste: '🗑️ ของเสีย' }[a.type] || a.type) + (a.item ? ' — ' + esc(a.item_th || a.item) + (a.item_th ? ' <span class="mm muted">(' + esc(a.item) + ')</span>' : '') : '') +

  // ที่เก็บจริงของร้าน (บอสกำหนด 9 ต.ค. 69) — เรียงตามทางเดินนับ · ทุกตู้นับทุกวัน (บอสตัดรอบนับรายสัปดาห์ออก) · ชื่อพม่า: ရေခဲသေတ္တာ = ตู้เย็น, ဖရီဇာ = ตู้ฟรีซ (รอ MON ยืนยัน)
  var SHOP_PLACES = [
    { th: 'CHILL-1', mm: 'ရေခဲသေတ္တာ 1', icon: '🧊', weekly: false },
    { th: 'FREEZER-1', mm: 'ဖရီဇာ 1', icon: '❄️', weekly: false },
    { th: 'CHILL-2', mm: 'ရေခဲသေတ္တာ 2', icon: '🧊', weekly: false },
    { th: 'FREEZER-2', mm: 'ဖရီဇာ 2', icon: '❄️', weekly: false },
    { th: 'ของแห้ง', mm: 'အခြောက်ပစ္စည်း', icon: '📦', weekly: false }
  ];
  // ค้นหาวัตถุดิบในหน้าบอส (ทุกที่เก็บ · ชื่อไทย/พม่า)
  function adminFound() {
    var q = S.admin.itemQ || '';
    if (!normQ(q)) return '';
    var hits = S.admin.data.items.filter(function (it) { return matchItem(it, q); });
    return hits.length ? '<p class="muted" style="margin:0 0 8px;font-size:13.5px">พบ ' + hits.length + ' รายการ</p><div class="list">' + hits.map(function (it) { return adminItemBtn(it, true); }).join('') + '</div>'
      : '<p class="muted">ไม่พบ "' + esc(q.trim()) + '" — ลองพิมพ์สั้นลง หรือกด ＋ เพิ่มรายการ</p>';
  }

  // ตู้ชุดร้านจับคู่ด้วยชื่อก่อนวงเล็บ/ช่องว่าง — บอสต่อท้ายชื่อได้ เช่น CHILL-2(Checker) ยังเป็น CHILL-2
  function shopBase(th) { return String(th || '').split(/[\s(（]/)[0]; }
  function shopZoneOf(p) { return ZONES.filter(function (x) { return shopBase(x.th) === p.th; })[0] || null; }
  function shopZoneIds() {
    return SHOP_PLACES.map(function (p) { var z = shopZoneOf(p); return z ? z.id : null; }).filter(Boolean);
  }
  function inShop(it) { var ids = shopZoneIds(); return L.itemLocs(it).some(function (z) { return ids.indexOf(z) >= 0; }); }

  // การ์ดในแท็บรายการของ: ยังไม่มีที่เก็บชุดใหม่ → สร้าง · มีแล้วแต่ยังจัดไม่ครบ → ไปจัด
  function shopPlacesCard() {
    // ปุ่มสร้างตู้ขึ้นเฉพาะร้านที่ยังไม่เคยสร้างเลย — สร้างแล้ว (แม้เปลี่ยนชื่อ/ลบบางตู้) ไม่บังคับให้สร้างอีก
    var A = S.admin, missing = SHOP_PLACES.filter(function (p) { return !shopZoneOf(p); });
    if (SHOP_PLACES.length - missing.length <= 1) { // "ของแห้ง" มีมาตั้งแต่แรก — มีไม่เกิน 1 ที่ = ยังไม่เริ่มตั้ง
      return '<div class="card form" style="padding:16px;margin-bottom:12px"><b>📍 ตั้งที่เก็บของร้าน (นับตามตู้จริง)</b>' +
        '<p class="muted" style="margin:0;font-size:14px">จะสร้าง ' + missing.map(function (p) { return esc(p.icon + ' ' + p.th); }).join(' · ') + ' เรียงตามลำดับเดินนับ (ทุกตู้นับทุกวัน) แล้วพาไปหน้าจัดของเข้าแต่ละตู้ · ระหว่างจัด น้องยังนับแบบเดิมได้</p>' +
        '<button class="btn btn-primary" data-act="plCreate">สร้างที่เก็บ ' + missing.length + ' ที่</button></div>';
    }
    var left = A.data.items.filter(function (it) { return it.active !== false && !inShop(it); }).length;
    var old = ZONES.filter(function (z) { return shopZoneIds().indexOf(z.id) < 0; });
    if (!left && !old.length) return '';
    return '<div class="card" style="padding:14px 16px;margin-bottom:12px"><b>📍 จัดของเข้าที่เก็บ</b><div class="muted" style="font-size:14px;margin:4px 0 10px">' +
      (left ? 'ยังไม่ได้จัด ' + left + ' รายการ (ยังอยู่หมวดเดิม)' : '✅ จัดครบแล้ว — ลบหมวดเดิม ' + old.length + ' หมวดได้') + '</div>' +
      '<button class="btn ' + (left ? 'btn-primary' : 'btn-ghost') + '" data-act="plOpen">' + (left ? 'ไปจัดของเข้าตู้' : 'ดู/แก้การจัด') + '</button></div>';
  }

  function placeAssignScreen() {
    var A = S.admin, P = A.plAssign, ids = shopZoneIds(), tgt = P.target;

    var left = A.data.items.filter(function (it) { return it.active !== false && !plPlaces(it).some(function (z) { return ids.indexOf(z) >= 0; }); }).length;

      '<p class="sub">1) เลือกตู้ที่ยืนอยู่ 2) แตะรายการที่อยู่ในตู้นั้นให้ขึ้น ✓ (ของอยู่หลายตู้ ก็ติ๊กในแต่ละตู้) 3) ทำครบทุกตู้แล้วกดบันทึก</p>' +

      '<label class="check" style="margin-bottom:10px"><input type="checkbox" data-input="plOnlyLeft"' + (P.onlyLeft ? ' checked' : '') + '> เฉพาะที่ยังไม่ได้จัด (' + left + ')</label>' +
      '<div class="list" id="pl-list">' + list.map(function (it) { return plRow(it, tgt); }).join('') + '</div></div>' +

      '<button class="btn btn-primary" data-act="plSave" id="pl-save"' + (n && !P.saving ? '' : ' disabled') + '>' + (P.saving ? 'กำลังบันทึก…' : '💾 บันทึก ' + n + ' รายการ') + '</button></div></div></div>';
    return h;
  }

  // ที่เก็บของรายการระหว่างจัด: ถ้าติ๊กตู้ใหม่แล้ว ใช้เฉพาะตู้ใหม่ (หมวดเดิมหลุดไปเอง) · ยังไม่ติ๊กเลย = หมวดเดิม
  function plPlaces(it) {
    var c = S.admin.plAssign && S.admin.plAssign.changed[it.id];
    return c ? c.places : L.itemLocs(it);

      '<span class="nm"><b>' + esc(it.name_th) + '</b><small class="mm">' + esc(it.name_mm) + '</small><span class="tagline">' +
      pl.map(function (z) { return '<i class="tg' + (ids.indexOf(z) >= 0 ? '' : ' old') + '">' + esc(zoneOf(z).icon + ' ' + zoneOf(z).th) + '</i>'; }).join('') + '</span></span>' +
      '<button class="tg k' + (kind === 'prep' ? ' prep' : '') + ' kbtn" data-act="plKind" data-id="' + esc(it.id) + '">' + (kind === 'prep' ? '🔪 ตัดแต่งแล้ว' : '🛒 ยังไม่ตัดแต่ง') + '</button></div>';
  }
  function plRefresh(id) {

  }

    S.admin.data.items.forEach(function (it) {
      L.itemLocs(it).forEach(function (z) {

        c[it.kind === 'prep' ? 'prep' : 'buy']++;

    });
    var h = top({ th: '🗂️ จัดการที่เก็บ', back: 'zonesBack', net: false }) + '<div class="wrap screen">' +
      '<p class="sub">ที่เก็บ = ตู้/ชั้นจริง (เช่น ตู้เย็น 1, ตู้ฟรีซ 2) ทีมนับทีละที่ · ลำดับ = ลำดับที่ทีมเดินนับ · ติดแท็กที่เก็บให้รายการได้ที่หน้าแก้รายการ</p><div class="list">' +

          '<small class="mm">' + esc(z.mm || '') + '</small><small class="muted">' + (manySec ? '👥 ' + esc(z.section || L.DEFAULT_SECTION) + ' · ' : '') + (z.weekly ? 'นับสัปดาห์ละครั้ง · ' : '') + '🛒 ยังไม่ตัดแต่ง ' + ((counts[z.id] || {}).buy || 0) + ' · 🔪 ตัดแต่งแล้ว ' + ((counts[z.id] || {}).prep || 0) + '</small></span></button>' +

    return h;

  function zoneEditScreen() {
    var A = S.admin, z = A.zoneDraft[A.zoneIdx], n = A.data.items.filter(function (it) { var l = L.itemLocs(it); return l.length === 1 && l[0] === z.id; }).length;

      '<div><label>ชื่อที่เก็บ (พม่า)</label><input type="text" id="z-mm" class="mm" value="' + esc(z.mm) + '" placeholder="ว่าง = แปลให้อัตโนมัติตอนบันทึก" maxlength="60">' +
      (z.th !== z.th0 && z.mm && z.mm === z.mm0 ? '<small class="muted">เปลี่ยนชื่อไทยแล้ว — ลบชื่อพม่าออกถ้าอยากให้แปลใหม่</small>' : '') + '</div>' +
      '<div><label>แผนก (ใครนับ/ส่งรายงานที่นี่)</label><input type="text" id="z-sec" list="z-sec-list" value="' + esc(z.section || L.DEFAULT_SECTION) + '" maxlength="30" placeholder="ครัว">' +
      '<datalist id="z-sec-list">' + staffSecChoices(A.data.staff).map(function (x) { return '<option value="' + esc(x) + '">'; }).join('') + '</datalist>' +
      '<small class="muted">พิมพ์ชื่อใหม่ = สร้างแผนกใหม่ (เช่น หน้าร้าน) · พนักงานที่ตั้งแผนกนี้จะเห็นที่เก็บนี้</small></div>' +
      '<button class="btn btn-primary" data-act="zoneDone">ตกลง</button>' +
      (A.zoneDraft.length > 1 ? (n ? '<p class="muted center" style="margin:0;font-size:13.5px">ลบที่เก็บนี้ไม่ได้ ยังมี ' + n + ' รายการที่อยู่ที่นี่ที่เดียว — ย้ายไปที่อื่นก่อน (รายการของ → 🏷️ ติดแท็กหลายรายการ)</p>'
        : '<button class="btn btn-danger" data-act="zoneDel">🗑️ ลบที่เก็บนี้</button>') : '') +
      '<p class="muted" style="margin:0;font-size:13px">กด "ตกลง" แล้วอย่าลืมกด "💾 บันทึกหมวด" ในหน้าก่อนหน้า</p></div></div>';
    return h;
  }

  // แผนกทั้งหมด = จากที่เก็บ + ที่ตั้งให้พนักงานไว้ก่อน (ยังไม่มีที่เก็บ)
  function staffSecChoices(st) {
    var out = L.sectionList(ZONES);
    (st || []).forEach(function (s) { L.staffSections(s).forEach(function (x) { if (out.indexOf(x) < 0) out.push(x); }); });
    return out;
  }

    var z = S.admin.zoneDraft[S.admin.zoneIdx], th = document.getElementById('z-th'), mm = document.getElementById('z-mm'), sec = document.getElementById('z-sec');

  }
