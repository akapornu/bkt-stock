<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f3ef">
<title>เช็คสต็อคครัว · บ้านขาวต้ม</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="สต็อคครัว">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f3ef;
  --card: #ffffff;
  --ink: #1c1917;
  --muted: #6b645e;
  --line: #e6e2dc;
  --brand: #0f6b5f;
  --brand-ink: #ffffff;
  --brand-soft: #e3f1ee;
  --ok: #157a3d;
  --ok-soft: #e2f5e8;
  --warn: #a35a00;
  --warn-soft: #fff1d6;
  --bad: #b42318;
  --bad-soft: #fde8e6;
  --radius: 16px;
  --shadow: 0 1px 2px rgba(28, 25, 23, .06), 0 4px 14px rgba(28, 25, 23, .06);
  --font: 'Noto Sans Thai', 'Noto Sans Myanmar', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45; }
body { min-height: 100vh; overscroll-behavior-y: contain; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
input, textarea, select { font: inherit; color: var(--ink); }
.mm { font-family: 'Noto Sans Myanmar', var(--font); line-height: 1.75; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
.hidden { display: none !important; }

/* ---------- แถบบน ---------- */
.top { position: sticky; top: 0; z-index: 20; background: rgba(245, 243, 239, .94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 10px; min-height: 60px; }
.top h1 { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.25; flex: 1; min-width: 0; }
.top h1 .mm { display: block; font-size: 13px; font-weight: 500; color: var(--muted); line-height: 1.5; }
.iconbtn { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; flex: none; }
.iconbtn:active { background: var(--line); }
.chip-me { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-weight: 600; font-size: 14px; flex: none; }
.net { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: none; }
.net.saving { background: var(--warn); animation: pulse 1s infinite; }
.net.offline { background: var(--bad); }
@keyframes pulse { 50% { opacity: .35; } }

/* ---------- ทั่วไป ---------- */
.screen { padding-top: 16px; padding-bottom: calc(140px + var(--safe-b)); }
.title { font-size: 22px; font-weight: 700; margin: 8px 0 2px; }
.title .mm { display: block; font-size: 16px; font-weight: 500; color: var(--muted); }
.sub { color: var(--muted); margin: 0 0 16px; }
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); }
.section-h { margin: 22px 0 10px; font-weight: 700; font-size: 17px; line-height: 1.5; }
.section-h .n { color: var(--muted); font-weight: 500; font-size: 15px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 56px; padding: 10px 18px; border-radius: 14px; font-weight: 700; font-size: 17px; text-align: center; line-height: 1.3; }
.btn .mm { font-weight: 500; font-size: 14px; }
.btn.stack { flex-direction: column; gap: 0; }
.btn-primary { background: var(--brand); color: var(--brand-ink); }
.btn-primary:active { filter: brightness(.92); }
.btn-primary[disabled] { opacity: .5; }
.btn-ghost { background: var(--card); border: 1.5px solid var(--line); }
.btn-ghost:active { background: var(--line); }
.btn-danger { background: var(--bad-soft); color: var(--bad); }
.btn-row { display: flex; gap: 10px; }
.btn-row .btn { flex: 1; }
.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: linear-gradient(to top, var(--bg) 70%, rgba(245, 243, 239, 0)); padding: 18px 0 calc(12px + var(--safe-b)); }
.bottom .wrap { display: flex; flex-direction: column; gap: 10px; }
.note { padding: 12px 14px; border-radius: 12px; font-size: 15px; }
.note.ok { background: var(--ok-soft); color: var(--ok); }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.note.bad { background: var(--bad-soft); color: var(--bad); }
.note.info { background: var(--brand-soft); color: var(--brand); }
.muted { color: var(--muted); }
.center { text-align: center; }
.spinner { width: 34px; height: 34px; border: 3px solid var(--line); border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; margin: 30vh auto 14px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- รหัส / เลือกคน ---------- */
.pin-dots { display: flex; justify-content: center; gap: 16px; margin: 26px 0 8px; }
.pin-dots i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--muted); }
.pin-dots i.on { background: var(--ink); border-color: var(--ink); }
.pin-msg { min-height: 26px; text-align: center; color: var(--bad); font-size: 15px; }
.who { display: grid; gap: 12px; margin-top: 18px; }
.who button { display: flex; align-items: center; gap: 14px; padding: 16px; text-align: left; }
.who .av { width: 52px; height: 52px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-weight: 800; font-size: 18px; flex: none; }
.who .av.lead { background: var(--brand); color: #fff; }
.who b { display: block; font-size: 19px; }

/* ---------- หน้าแรก ---------- */
.hero { padding: 18px; display: flex; align-items: center; gap: 16px; }
.ring { --p: 0; width: 76px; height: 76px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: conic-gradient(var(--brand) calc(var(--p) * 1%), var(--line) 0); }
.ring span { width: 60px; height: 60px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-weight: 800; font-size: 17px; }
.hero b { font-size: 20px; display: block; }
.zones { display: grid; gap: 12px; }
.zone { display: flex; align-items: center; gap: 14px; padding: 14px 16px; text-align: left; width: 100%; position: relative; }
.zone:active { transform: scale(.99); }
.zone .ic { font-size: 30px; width: 40px; text-align: center; flex: none; }
.zone .tx { flex: 1; min-width: 0; }
.zone .tx b { display: block; font-size: 17px; line-height: 1.3; }
.zone .tx .mm { display: block; font-size: 14px; color: var(--muted); }
.zone .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 6px; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; background: var(--brand); border-radius: 3px; }
.zone.done .bar i { background: var(--ok); }
.zone .cnt { font-weight: 800; font-size: 17px; flex: none; text-align: right; }
.zone .cnt small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
.zone.optional { opacity: .72; }
.tag { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; line-height: 1.5; background: var(--bg); color: var(--muted); }
.tag .mm { line-height: 1.5; }
.need .tag { font-size: 14px; padding: 4px 12px; border-radius: 10px; }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.brand { background: var(--brand-soft); color: var(--brand); }

/* ---------- รายการนับ ---------- */
.filter { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 4px 0 12px; }
.toggle { display: inline-block; text-align: left; padding: 7px 14px; border-radius: 14px; background: var(--card); border: 1.5px solid var(--line); font-size: 14px; font-weight: 600; line-height: 1.3; flex: none; }
.toggle .mm { display: block; font-size: 12px; font-weight: 500; line-height: 1.5; }
.toggle.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.list { display: grid; gap: 10px; }
.row { padding: 12px 12px 12px 14px; border-left: 5px solid transparent; display: flex; gap: 10px; align-items: center; scroll-margin: 90px 0 260px; }
.row.counted { border-left-color: var(--ok); }
.row.below { border-left-color: var(--bad); background: linear-gradient(90deg, var(--bad-soft), var(--card) 65%); }
.row.lowlv { border-left-color: var(--warn); }
.row.active { outline: 3px solid var(--brand); outline-offset: 1px; }
.row .nm { flex: 1; min-width: 0; }
.row .nm b { display: block; font-size: 17px; line-height: 1.3; }
.row .nm .mm { display: block; font-size: 15px; color: #3f3a36; }
.row .hint { font-size: 13px; color: var(--muted); margin-top: 3px; line-height: 1.6; }
.need .tag b { display: block; }
.need .tag .mm { display: block; font-weight: 500; font-size: 13px; }
.row .need { margin-top: 5px; }
.step { display: flex; align-items: center; gap: 4px; flex: none; }
.step button { width: 42px; height: 48px; border-radius: 12px; background: var(--bg); font-size: 24px; font-weight: 700; color: var(--ink); }
.step button:active { background: var(--line); }
.step .val { width: 60px; height: 52px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center; font-size: 21px; font-weight: 800; line-height: 1; }
.step .val small { font-size: 11px; font-weight: 600; color: var(--muted); margin-top: -8px; }
.step .val.empty { color: var(--muted); border-style: dashed; }
.levels { display: flex; gap: 6px; flex: none; }
.levels button { min-width: 54px; height: 48px; padding: 0 8px; border-radius: 12px; background: var(--bg); font-weight: 700; font-size: 14px; line-height: 1.15; }
.levels button small { display: block; font-weight: 500; font-size: 11px; }
.levels button.on.ok { background: var(--ok); color: #fff; }
.levels button.on.low { background: var(--warn); color: #fff; }
.levels button.on.out { background: var(--bad); color: #fff; }

/* ---------- แป้นตัวเลข ---------- */
.sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(28, 25, 23, .28); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--card); border-radius: 22px 22px 0 0; box-shadow: 0 -8px 30px rgba(0, 0, 0, .18); padding: 14px 16px calc(14px + var(--safe-b)); max-width: 560px; margin: 0 auto; animation: up .18s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.kp-head { display: flex; align-items: flex-start; gap: 10px; }
.kp-head .nm { flex: 1; min-width: 0; }
.kp-head b { font-size: 19px; display: block; line-height: 1.3; }
.kp-head .mm { font-size: 15px; color: #3f3a36; display: block; }
.kp-head .hint { font-size: 13.5px; color: var(--muted); }
.kp-disp { margin: 10px 0 12px; height: 64px; border-radius: 14px; background: var(--bg); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 36px; font-weight: 800; }
.kp-disp small { font-size: 16px; font-weight: 600; color: var(--muted); }
.kp-disp.empty { color: var(--muted); }
.kp-disp.below { background: var(--bad-soft); color: var(--bad); }
.kp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kp-grid button { height: 58px; border-radius: 14px; background: var(--bg); font-size: 26px; font-weight: 700; }
.kp-grid button:active { background: var(--line); }
.pinpad button { background: var(--card); box-shadow: var(--shadow); height: 64px; }
.kp-grid button.fn { font-size: 16px; }
.kp-grid button.dot { font-size: 34px; line-height: 1; padding-bottom: 12px; }
.kp-actions { display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px; margin-top: 10px; }
.kp-lv { display: grid; gap: 10px; margin: 12px 0 4px; }
.kp-lv button { min-height: 62px; border-radius: 14px; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; }
.kp-lv .ok { background: var(--ok-soft); color: var(--ok); }
.kp-lv .low { background: var(--warn-soft); color: var(--warn); }
.kp-lv .out { background: var(--bad-soft); color: var(--bad); }
.kp-lv .mm { font-size: 15px; font-weight: 600; }

/* ---------- ตรวจและส่ง ---------- */
.sum-list { padding: 4px 14px; }
.sum-row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.sum-row:last-child { border-bottom: 0; }
.sum-row .nm { flex: 1; min-width: 0; }
.sum-row .nm b { display: block; font-size: 16px; }
.sum-row .nm .mm { font-size: 14px; color: var(--muted); }
.sum-row .q { text-align: right; flex: none; }
.sum-row .q b { font-size: 18px; display: block; }
.sum-row .q small { font-size: 12.5px; color: var(--muted); }
.zone-label { font-size: 13px; font-weight: 700; color: var(--muted); padding: 12px 0 2px; letter-spacing: .02em; }
textarea { width: 100%; min-height: 84px; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); resize: vertical; }
.preview { white-space: pre-wrap; font-size: 14.5px; line-height: 1.6; padding: 14px 16px; background: #eef7ec; border-radius: 16px; border: 1px solid #d5ead0; }
.bigcheck { width: 88px; height: 88px; border-radius: 50%; background: var(--ok); color: #fff; font-size: 48px; display: grid; place-items: center; margin: 26px auto 12px; }

/* ---------- แจ้งด่วน ---------- */
.choice { display: grid; gap: 10px; }
.choice button { padding: 14px 16px; text-align: left; display: flex; align-items: center; gap: 12px; border: 2px solid transparent; }
.choice button.on { border-color: var(--brand); background: var(--brand-soft); }
.choice .ic { font-size: 26px; }
.choice .mm { display: block; font-size: 14px; color: var(--muted); }
.choice span > span:first-child { font-weight: 700; }
.field { margin: 16px 0 0; }
.field label { display: block; font-weight: 700; margin-bottom: 6px; }
.field label .mm { font-weight: 500; font-size: 14px; color: var(--muted); margin-left: 6px; }
.inp { width: 100%; height: 52px; padding: 0 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); font-size: 17px; }
.inp:focus, textarea:focus, select:focus { outline: 3px solid var(--brand-soft); border-color: var(--brand); }
.picks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.picks button { padding: 8px 12px; border-radius: 12px; background: var(--card); border: 1.5px solid var(--line); text-align: left; font-size: 15px; line-height: 1.3; }
.picks button .mm { display: block; font-size: 12.5px; color: var(--muted); }
.picked { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--brand-soft); color: var(--brand); font-weight: 700; margin-top: 10px; }
.picked span { flex: 1; }

/* ---------- หน้าบอส ---------- */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: none; padding: 9px 14px; border-radius: 999px; background: var(--card); border: 1.5px solid var(--line); font-weight: 600; font-size: 14.5px; }
.tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.a-item { display: flex; align-items: center; gap: 10px; padding: 12px 14px; text-align: left; width: 100%; }
.a-item .nm { flex: 1; min-width: 0; }
.a-item .nm b { display: block; }
.a-item .nm small { color: var(--muted); }
.a-item.off { opacity: .5; }
.form { display: grid; gap: 12px; }
.form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form label { font-weight: 700; font-size: 14px; display: block; margin-bottom: 4px; }
.form select, .form input[type=text], .form input[type=number], .form input[type=password], .form input[type=tel] { width: 100%; height: 48px; padding: 0 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); font-size: 16px; }
.check { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.check input { width: 22px; height: 22px; accent-color: var(--brand); }
.hist { padding: 12px 14px; }
.hist summary { cursor: pointer; display: flex; justify-content: space-between; gap: 10px; font-weight: 600; list-style: none; }
.hist summary::-webkit-details-marker { display: none; }
.hist pre { white-space: pre-wrap; font-family: var(--font); font-size: 14px; background: var(--bg); padding: 10px 12px; border-radius: 12px; margin: 10px 0 0; }
.steps { margin: 6px 0 0; padding-left: 20px; font-size: 14.5px; }
.steps li { margin: 4px 0; }
.staff-row { display: grid; grid-template-columns: 1fr 120px 44px; gap: 8px; align-items: center; padding: 10px 12px; }
.toast { position: fixed; left: 50%; bottom: calc(96px + var(--safe-b)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 15px; box-shadow: var(--shadow); max-width: 90vw; text-align: center; animation: up .18s ease-out; }
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(28, 25, 23, .4); display: grid; place-items: center; padding: 16px; }
.modal .card { width: 100%; max-width: 420px; padding: 20px; }
.modal h3 { margin: 0 0 8px; font-size: 19px; }

/* ---------- รูปแนบ ---------- */
.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.ph { position: relative; aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: var(--card); border: 1.5px solid var(--line); }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph button { position: absolute; top: 6px; right: 6px; width: 32px; height: 32px; border-radius: 50%; background: rgba(28, 25, 23, .72); color: #fff; font-size: 15px; }
.ph.add { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border: 2px dashed var(--line); color: var(--brand); font-weight: 700; font-size: 13.5px; line-height: 1.3; padding: 6px; cursor: pointer; }
.ph.add .ic { font-size: 28px; }
.ph.add .mm { font-size: 12px; font-weight: 500; }
.ph.add input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.ph.add.busy { color: var(--muted); }
.photo-view { padding: 12px !important; max-width: 520px !important; }
.photo-view img { width: 100%; max-height: 70vh; object-fit: contain; border-radius: 12px; display: block; background: var(--bg); }

a.btn { text-decoration: none; color: inherit; }

/* ---------- จัดลำดับ (หน้าบอส) ---------- */
.ro-list { display: grid; gap: 8px; margin-top: 12px; }
.ro-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 4px; user-select: none; -webkit-user-select: none; position: relative; }
.ro-row.off { opacity: .5; }
.ro-row.dragging { z-index: 5; box-shadow: 0 14px 34px rgba(28, 25, 23, .22); outline: 2px solid var(--brand); }
.ro-row .handle { width: 44px; height: 48px; display: grid; place-items: center; font-size: 24px; color: var(--muted); touch-action: none; cursor: grab; flex: none; }
.ro-row.dragging .handle { cursor: grabbing; color: var(--brand); }
.ro-row .num { width: 24px; text-align: right; color: var(--muted); font-size: 13px; flex: none; }
.ro-row .nm { flex: 1; min-width: 0; }
.ro-row .nm b { display: block; font-size: 16px; }
.ro-row .nm small { display: block; font-size: 13px; color: var(--muted); }
.ro-row .mv { width: 40px; height: 44px; border-radius: 10px; background: var(--bg); font-size: 18px; font-weight: 700; flex: none; }
.ro-row .mv:active { background: var(--line); }

/* ---------- สถานะตอนตรวจรหัส ---------- */
.pin-dots.busy i { background: var(--brand); border-color: var(--brand); animation: pulse 1s infinite; }
.pin-dots.busy i:nth-child(2) { animation-delay: .15s; }
.pin-dots.busy i:nth-child(3) { animation-delay: .3s; }
.pin-dots.busy i:nth-child(4) { animation-delay: .45s; }
.pin-dots.busy i:nth-child(5) { animation-delay: .6s; }
.pin-dots.busy i:nth-child(6) { animation-delay: .75s; }
.pin-dots.bad { animation: shake .42s; }
.pin-dots.bad i { border-color: var(--bad); }
.pin-msg.busy { color: var(--brand); font-weight: 600; }
.pin-msg.bad { font-weight: 700; }
.kp-grid.busy { opacity: .4; pointer-events: none; }
.pinpad button:active { background: var(--brand-soft); transform: scale(.96); }
.spin-sm { display: inline-block; width: 15px; height: 15px; border: 2px solid var(--brand-soft); border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 8px; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-12px); } 40% { transform: translateX(12px); } 60% { transform: translateX(-7px); } 80% { transform: translateX(7px); } }

  var DAY_CUTOFF_HOUR = 5;            // นับหลังเที่ยงคืนก่อนตี 5 = ยังเป็นรอบของเมื่อวาน
  var DAYS = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
  var MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function businessDate(now) {
    var t = new Date((now ? now.getTime() : Date.now()) + TZ_OFFSET_MS);
    if (t.getUTCHours() < DAY_CUTOFF_HOUR) t = new Date(t.getTime() - 24 * 3600 * 1000);
    return t.getUTCFullYear() + '-' + pad(t.getUTCMonth() + 1) + '-' + pad(t.getUTCDate());
  }

  function bkkTime(iso) {
    var t = new Date(new Date(iso).getTime() + TZ_OFFSET_MS);
    return pad(t.getUTCHours()) + ':' + pad(t.getUTCMinutes());

  function parseDate(dateStr) {
    var p = String(dateStr).split('-');
    return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
  }

  function dayOfWeek(dateStr) { return parseDate(dateStr).getUTCDay(); }

  function thaiDate(dateStr) {
    var d = parseDate(dateStr);
    return DAYS[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()] + ' ' + String(d.getUTCFullYear() + 543).slice(-2);
  }

  function isNum(v) { return typeof v === 'number' && isFinite(v); }

  // พร้อมคำนวณสั่งซื้อไหม: ต้องมี Min, Max, หน่วย และไม่มีโน้ต "ต้องตั้งค่า"
  function isConfigured(item) {
    return !item.setup_note && isNum(item.min) && isNum(item.max) && item.min <= item.max && !!item.unit;
  }

  // กฎเดิมของร้าน: เหลือน้อยกว่า Min → เติมจนถึง Max · Min = 0 หมายถึง "หมดแล้วค่อยซื้อ"
  function needQty(item, qty) {
    if (!isConfigured(item) || !isNum(qty)) return null;
    var below = qty < item.min || (item.min === 0 && qty === 0);
    if (!below) return 0;
    return Math.max(0, Math.round((item.max - qty) * 100) / 100);
  }

  function zoneDue(zone, dateStr, fullCountDay) {
    return !zone.weekly || dayOfWeek(dateStr) === Number(fullCountDay);
  }

  function hasCount(e) { return !!e && (isNum(e.v) || !!e.lv); }

  // รวมผลนับของคนอื่นเข้ามา — ทับเป็นรายชิ้น (คนกดทีหลังชนะ) · entry = null คือลบผลนับชิ้นนั้น
  function mergeEntries(draft, entries, by, atIso) {
    draft = draft || { entries: {} };
    draft.entries = draft.entries || {};
    Object.keys(entries || {}).forEach(function (id) {
      var e = entries[id];
      if (e === null || (!isNum(e.v) && !e.lv)) { delete draft.entries[id]; return; }
      draft.entries[id] = { v: isNum(e.v) ? e.v : null, lv: e.lv || null, by: by, at: atIso };
    });
    draft.updated_at = atIso;
    return draft;
  }

  // สรุปทั้งรอบ: ของต้องซื้อ / ต้องทำเพิ่ม / รายการที่ต้องดู / ที่ยังไม่นับ
  function summarize(items, zones, draft, opts) {
    var entries = (draft && draft.entries) || {};
    var zoneById = {};
    zones.forEach(function (z) { zoneById[z.id] = z; });
    var started = {};
    items.forEach(function (it) { if (hasCount(entries[it.id])) started[it.zone] = true; });
    var out = { buy: [], prep: [], attention: [], uncounted: [], counters: [], zones: {} };
    zones.forEach(function (z) {
      out.zones[z.id] = { total: 0, counted: 0, below: 0, due: zoneDue(z, opts.date, opts.fullCountDay), started: !!started[z.id], by: [] };
    });
    var counters = {};
    items.filter(function (it) { return it.active !== false && zoneById[it.zone]; })
      .sort(function (a, b) { return zones.indexOf(zoneById[a.zone]) - zones.indexOf(zoneById[b.zone]) || a.sort - b.sort; })
      .forEach(function (it) {
        var z = out.zones[it.zone], e = entries[it.id];
        z.total++;
        if (!hasCount(e)) {
          if (z.due || z.started) out.uncounted.push(it);
          return;
        }
        z.counted++;
        counters[e.by] = true;
        if (e.by && z.by.indexOf(e.by) < 0) z.by.push(e.by);
        if (!isConfigured(it)) {
          var lv = e.lv || (isNum(e.v) && e.v === 0 ? 'out' : null);
          if (lv === 'low' || lv === 'out') { z.below++; out.attention.push({ item: it, level: lv, qty: e.v }); }
          return;
        }
        var need = needQty(it, e.v);
        if (need > 0) {
          z.below++;
          (it.kind === 'prep' ? out.prep : out.buy).push({ item: it, qty: e.v, need: need });
        }
      });
    out.counters = Object.keys(counters).filter(Boolean);
    return out;
  }

  // แสดงเลขแบบเดียวกับที่พิมพ์ในแป้น: 0.5, 1.25, 1,500
  function fmtNum(n) {
    if (!isNum(n)) return '–';
    var r = Math.round(n * 100) / 100;
    return Math.abs(r) >= 1000 && r % 1 === 0 ? r.toLocaleString('en-US') : String(r);
  }

  function unitText(item) { return item.unit + (item.size ? ' (' + item.size + ')' : ''); }

  // ข้อความ LINE ถึงบอส (ภาษาไทย) — สั้น อ่านจบในจอเดียวถ้าของไม่เยอะ
  function buildBossMessage(sum, zones, meta) {
    var L = [];
    L.push('🛒 ของที่ต้องซื้อ — บ้านขาวต้ม' + (meta.resend ? ' (ฉบับแก้ไข)' : ''));
    L.push(thaiDate(meta.date) + ' · ' + meta.by + ' ส่ง ' + bkkTime(meta.at));
    var helpers = sum.counters.filter(function (n) { return n !== meta.by; });
    if (helpers.length) L.push('ช่วยนับ: ' + helpers.join(', '));
    L.push('');
    if (!sum.buy.length) {
      L.push('✅ รอบนี้ไม่มีของต้องซื้อ');
    } else {
      L.push('(จำนวนสั่ง = เติมให้ถึง Max · ปรับเพิ่ม/ลดได้ตามยอดขายช่วงนั้น)');
      L.push('');
      zones.forEach(function (z) {
        var rows = sum.buy.filter(function (r) { return r.item.zone === z.id; });
        if (!rows.length) return;
        L.push(z.icon + ' ' + z.th + ' (' + rows.length + ')');
        rows.forEach(function (r) {
          var b = buyQty(r.item, r.need);
          L.push('• ' + r.item.name_th + ' → สั่ง ' + fmtNum(b.qty) + ' ' + b.unit + (b.size ? ' (' + b.size + ')' : '') +
            (b.approxCount !== null ? ' (≈' + fmtNum(b.approxCount) + ' ' + r.item.unit + ')' : ''));
          L.push('   เหลือ ' + fmtNum(r.qty) + ' | Min ' + fmtNum(r.item.min) + ' | Max ' + fmtNum(r.item.max) + (b.approxCount !== null ? ' (' + r.item.unit + ')' : ''));
        });
      });
    }
    if (sum.attention.length) {
      L.push('');
      L.push('⚠️ ยังไม่ตั้ง Min/Max แต่ใกล้หมด/หมด');
      sum.attention.forEach(function (r) { L.push('• ' + r.item.name_th + ' — ' + LEVEL_TH[r.level]); });
    }
    L.push('');
    if (sum.prep.length) L.push('🔪 ครัวต้องทำเพิ่ม ' + sum.prep.length + ' รายการ (ทีมจัดการเอง)');
    if (sum.uncounted.length) L.push('⏳ ยังไม่ได้นับ ' + sum.uncounted.length + ' รายการ');
    if (meta.note) {
      L.push('📝 ' + meta.by + ': ' + (meta.note_th || meta.note));
      if (meta.note_th) L.push('   ↳ ต้นฉบับพม่า (แปลอัตโนมัติ): ' + meta.note);
    }
    if (meta.appUrl) L.push(sum.buy.length ? '🛒 สร้างใบสั่งซื้อจากรอบนี้: ' + meta.appUrl + '#po' : 'ดูละเอียดในแอพ: ' + meta.appUrl);
    while (L[L.length - 1] === '') L.pop();
    var text = L.join('\n');
    return text.length > 4900 ? text.slice(0, 4880) + '\n…(ตัดท้าย ดูต่อในแอพ)' : text;
  }

  // ================= สั่งซื้อ / รับของ =================
  // หน่วยที่นับเป็นชิ้น → จำนวนสั่งปัดขึ้นเป็นจำนวนเต็ม (น้ำหนักไม่ปัด เว้นแต่ตั้ง buy_step)
  var DISCRETE = ['แพ็ค', 'ถุง', 'กล่อง', 'ฟอง', 'ตัว', 'ชิ้น', 'ลูก', 'หัว', 'ก้อน', 'ถ้วย', 'จาน', 'หลอด', 'แผ่น', 'ขวด', 'กำ', 'เม็ด'];
  function round2(n) { return Math.round(n * 100) / 100; }

  // จำนวนที่ต้องเติม (หน่วยนับ) → จำนวนสั่ง (หน่วยซื้อ) เช่น กุ้ง ต้องเติม 45 ตัว, 1 กก. ≈ 40 ตัว, ปัดทีละ 0.5 → สั่ง 1.5 กก. (≈60 ตัว)
  function buyQty(item, needCount) {
    var conv = !!item.buy_unit && isNum(item.buy_factor) && item.buy_factor > 0;
    var f = conv ? item.buy_factor : 1;
    var unit = conv ? item.buy_unit : item.unit;
    var step = isNum(item.buy_step) && item.buy_step > 0 ? item.buy_step : (DISCRETE.indexOf(unit) >= 0 ? 1 : 0);
    var q = needCount / f;
    if (step) q = Math.ceil(q / step - 1e-9) * step;
    q = round2(q);
    return { qty: q, unit: unit, size: conv ? '' : (item.size || ''), factor: f, approxCount: conv ? round2(q * f) : null };
  }

  // บรรทัดใบสั่งจากรายการต้องซื้อของรอบนับ
  function poLineFromNeed(r, unitsMm) {
    var it = r.item, b = buyQty(it, r.need);
    return {
      key: it.id, item_id: it.id, name_th: it.name_th, name_mm: it.name_mm || '',
      unit: b.unit, unit_mm: b.approxCount !== null ? ((unitsMm && unitsMm[b.unit]) || '') : (it.unit_mm || ''),
      size: b.size, qty: b.qty, factor: b.factor, count_unit: it.unit, received: 0,
      left: r.qty, min: it.min, max: it.max
    };
  }

  // สถานะใบสั่ง: ปิด > รับครบ > รับบางส่วน > รอรับ
  function poStatus(po) {
    if (po.status === 'closed') return 'closed';
    var lines = (po.lines || []).filter(function (l) { return l.qty > 0; });
    var got = (po.lines || []).some(function (l) { return l.received > 0; });
    if (lines.length && lines.every(function (l) { return (l.received || 0) >= l.qty - 1e-9; })) return 'received';
    return got ? 'partial' : 'open';
  }
  var PO_STATUS_TH = { open: 'รอรับ', partial: 'รับบางส่วน', received: 'รับครบ', closed: 'ปิดแล้ว' };

  function lineQtyText(qty, l) { return fmtNum(qty) + ' ' + l.unit + (l.size ? ' (' + l.size + ')' : ''); }

  // ข้อความคัดลอกไปส่งร้าน/ซัพพลายเออร์
  function buildPoText(po, meta) {
    var L = ['สั่งของ ร้านบ้านขาวต้ม · ใบสั่ง #' + po.id, thaiDate(meta.date)];
    if (po.supplier_name) L.push('ถึง: ' + po.supplier_name);
    L.push('');
    (po.lines || []).filter(function (l) { return l.qty > 0; }).forEach(function (l, i) {
      L.push((i + 1) + '. ' + l.name_th + ' ' + lineQtyText(l.qty, l));
    });
    if (po.note) { L.push(''); L.push('หมายเหตุ: ' + po.note); }
    L.push('');
    L.push('ขอบคุณครับ');
    return L.join('\n');
  }

  // ข้อความ LINE ถึงบอสเมื่อน้องกดรับของ
  function buildReceiveMessage(po, lines, meta) {
    var L = [];
    L.push('📦 รับของแล้ว · ' + (po ? 'ใบสั่ง #' + po.id : 'ไม่มีใบสั่ง') + (meta.supplier ? ' · ' + meta.supplier : ''));
    L.push('รับโดย ' + meta.by + ' · ' + bkkTime(meta.at));
    if (lines.length) {
      L.push('');
      L.push('ได้รับรอบนี้ (' + lines.length + ' รายการ)');
      lines.forEach(function (l) {
        L.push('• ' + l.name_th + ' ' + lineQtyText(l.qty, l) + (l.count ? ' (นับได้ ' + fmtNum(l.count) + ' ' + l.count_unit + ')' : '') + (l.extra ? ' ➕ไม่อยู่ในใบสั่ง' : ''));
      });
    }
    if (po) {
      var short = po.lines.filter(function (l) { return l.qty > 0 && (l.received || 0) < l.qty - 1e-9; });
      L.push('');
      if (!short.length) L.push('✅ ใบสั่ง #' + po.id + ' มาครบแล้ว');
      else {
        L.push('⚠️ ยังค้าง ' + short.length + ' รายการ');
        short.forEach(function (l) {
          L.push('• ' + l.name_th + ' — สั่ง ' + lineQtyText(l.qty, l) + ' · ได้แล้ว ' + fmtNum(l.received || 0));
        });
      }
    }
    if (meta.amount) L.push('💵 ยอดบิล ' + Number(meta.amount).toLocaleString('en-US') + ' บาท');
    if (meta.photoUrls && meta.photoUrls.length) {
      L.push('📷 รูป ' + meta.photoUrls.length + ' รูป (เปิดใน Google Drive ของบอส):');
      meta.photoUrls.forEach(function (u) { L.push(u); });
    }
    if (meta.note) {
      L.push('📝 ' + meta.by + ': ' + (meta.note_th || meta.note));
      if (meta.note_th) L.push('   ↳ ต้นฉบับพม่า (แปลอัตโนมัติ): ' + meta.note);
    }
    var text = L.join('\n');
    return text.length > 4900 ? text.slice(0, 4880) + '\n…(ตัดท้าย ดูต่อในแอพ)' : text;
  }

  var ALERT_TH = { runout: '⏳ ของจะหมดก่อนพีค', spoiled: '🗑️ ของเสีย/หมดอายุ', other: '📣 แจ้งเรื่องอื่น' };

  var MM_RE = /[\u1000-\u109F]/;
  function hasBurmese(s) { return MM_RE.test(String(s || '')); }
  // เลขพม่า ၀-၉ → 0-9
  function mmDigits(s) { return String(s || '').replace(/[\u1040-\u1049]/g, function (d) { return String(d.charCodeAt(0) - 0x1040); }); }

  // ช่องที่น้องพิมพ์เป็นพม่า: server แปลไทยใส่ *_th มาให้ → บอสเห็นคำแปลก่อน ตามด้วยต้นฉบับ
  function buildAlertMessage(a) {
    var L = ['🚨 แจ้งด่วนจาก ' + a.by + ' · ' + bkkTime(a.at), ALERT_TH[a.type] || ALERT_TH.other];
    var item = a.item_th ? a.item_th + ' (พม่า: ' + a.item + ')' : a.item;
    var qty = a.qty_th || a.qty;
    if (item) L.push('ของ: ' + item + (qty ? ' — ' + qty : ''));
    else if (qty) L.push('จำนวน: ' + qty);
    if (a.note) {
      L.push('รายละเอียด: ' + (a.note_th || a.note));
      if (a.note_th) L.push('   ↳ ต้นฉบับพม่า: ' + a.note);
    }
    if (a.item_th || a.qty_th || a.note_th) L.push('🌐 แปลอัตโนมัติจากภาษาพม่า');
    if (a.photoUrls && a.photoUrls.length) {
      L.push('📷 รูป ' + a.photoUrls.length + ' รูป (เปิดใน Google Drive ของบอส):');
      a.photoUrls.forEach(function (u) { L.push(u); });
    }
    return L.join('\n');
  }

  // ตรวจรายการที่บอสแก้ในหน้าตั้งค่า — คืนข้อความผิด (ว่าง = ผ่าน)
  function validateItem(it) {
    var errs = [];
    if (!String(it.name_th || '').trim()) errs.push('ต้องมีชื่อไทย');
    if (!isNum(it.min) || !isNum(it.max)) errs.push('ต้องใส่ Min และ Max เป็นตัวเลข');
    else if (it.min < 0 || it.max <= 0) errs.push('Min ต้องไม่ติดลบ และ Max ต้องมากกว่า 0');
    else if (it.min > it.max) errs.push('Min ต้องไม่มากกว่า Max');
    if (!String(it.unit || '').trim()) errs.push('ต้องมีหน่วย');
    if (!isNum(it.step) || it.step <= 0) errs.push('ปุ่ม +/− ต้องเพิ่มทีละมากกว่า 0');
    if (String(it.buy_unit || '').trim() && !(isNum(it.buy_factor) && it.buy_factor > 0)) errs.push('มีหน่วยซื้อแล้ว ต้องใส่ว่า 1 ' + it.buy_unit + ' ได้กี่ ' + (it.unit || 'หน่วย'));
    if (isNum(it.buy_step) && it.buy_step < 0) errs.push('ปัดจำนวนสั่งต้องไม่ติดลบ');
    return errs;
  }

  return {
    businessDate: businessDate, bkkTime: bkkTime, dayOfWeek: dayOfWeek, thaiDate: thaiDate,
    isNum: isNum, isConfigured: isConfigured, needQty: needQty, zoneDue: zoneDue, hasCount: hasCount,
    mergeEntries: mergeEntries, summarize: summarize, fmtNum: fmtNum, unitText: unitText,
    buildBossMessage: buildBossMessage, buildAlertMessage: buildAlertMessage, validateItem: validateItem,
    hasBurmese: hasBurmese, mmDigits: mmDigits,
    buyQty: buyQty, poLineFromNeed: poLineFromNeed, poStatus: poStatus, buildPoText: buildPoText,
    buildReceiveMessage: buildReceiveMessage, round2: round2,
    LEVEL_TH: LEVEL_TH, PO_STATUS_TH: PO_STATUS_TH
  };
})();

if (typeof module !== 'undefined') module.exports = Logic;

<script>
(function () {
  'use strict';

  // ---------- ต่อหลังบ้าน (Apps Script จริง หรือ mock ตอนพัฒนา) ----------
  var MOCK = window.__MOCK__;
  // BKT_API มีค่า = หน้าแอพบน GitHub Pages → เรียกหลังบ้านด้วย POST (ไม่แนบคุกกี้ Google)
  // ไม่มีค่า = เปิดจากลิงก์ script.google.com เดิม → ใช้ google.script.run
  var API_URL = window.BKT_API && window.BKT_API.indexOf('https://') === 0 ? window.BKT_API : '';
  function api(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    S.lastApi = Date.now();
    if (MOCK) return MOCK.call(fn, args);
    if (API_URL) return postApi(fn, args);
    return new Promise(function (res, rej) {
      var r = google.script.run.withSuccessHandler(res).withFailureHandler(rej);
      r[fn].apply(r, args);
    });
  }
  function postApi(fn, args) {
    var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 45000);
    return fetch(API_URL, {
      method: 'POST', redirect: 'follow', credentials: 'omit', signal: ctl ? ctl.signal : undefined,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args })
    }).then(function (r) {
      if (!r.ok) throw new Error('network: HTTP ' + r.status);
      return r.json();
    }, function (e) {
      throw new Error('network: ' + (e && e.name === 'AbortError' ? 'timeout' : errMsg(e)));
    }).then(function (j) {
      clearTimeout(timer);
      if (!j.ok) throw new Error(j.error);
      return j.data;
    }, function (e) { clearTimeout(timer); throw e; });
  }
  function errMsg(e) { return String((e && e.message) || e || '').replace(/^(Exception|Error):\s*/i, ''); }
  function isNetErr(e) { return /network|NetworkError|Failed to fetch|Load failed|เครือข่าย|timed? ?out|unavailable/i.test(errMsg(e)); }

  var store = {
    get: function (k) { try { return JSON.parse(localStorage.getItem('bkt:' + k)); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem('bkt:' + k, JSON.stringify(v)); } catch (e) { /* โหมดส่วนตัว */ } },
    del: function (k) { try { localStorage.removeItem('bkt:' + k); } catch (e) { /* */ } }
  };

  var $app = document.getElementById('app');
  var L = Logic;

  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function tr(k, vars) {
    var p = I18N[k] || [k, k];
    var f = function (s) { return String(s).replace(/\{(\w+)\}/g, function (_, v) { return vars && vars[v] !== undefined ? vars[v] : ''; }); };
    return { th: f(p[0]), mm: f(p[1]) };
  }
  // ไทยบรรทัดบน พม่าบรรทัดล่าง
  function bi(k, vars) { var x = tr(k, vars); return '<span>' + esc(x.th) + '</span><span class="mm">' + esc(x.mm) + '</span>'; }
  // ไทย · พม่า ในบรรทัดเดียว
  // ปุ่มสองบรรทัดที่มีไอคอนอยู่บรรทัดไทย
  function biIcon(icon, k) { var x = tr(k); return '<span>' + icon + ' ' + esc(x.th) + '</span><span class="mm">' + esc(x.mm) + '</span>'; }
  function bi1(k, vars) { var x = tr(k, vars); return esc(x.th) + ' · <span class="mm">' + esc(x.mm) + '</span>'; }
  function buzz() {
    try { if (navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate(8); } catch (e) { /* */ }
  }

  // ---------- สถานะ ----------
  var S = {
    screen: 'loading', pin: store.get('pin'), me: store.get('me'), boot: null,
    draft: { entries: {} }, pending: {}, inflight: null, net: 'ok', saveTimer: null,
    zone: null, onlyUncounted: false, kp: null, from: 'zone', note: '', result: null,
    pinBuf: '', pinMsg: '', urgent: null, admin: null, error: ''
  };

  function zoneOf(id) { return ZONES.filter(function (z) { return z.id === id; })[0]; }
  function items() {
    return (S.boot ? S.boot.items : []).slice().sort(function (a, b) {
      return ZONES.indexOf(zoneOf(a.zone)) - ZONES.indexOf(zoneOf(b.zone)) || a.sort - b.sort;
    });
  }
  function zoneItems(zid) { return items().filter(function (i) { return i.zone === zid; }); }
  function itemById(id) { return items().filter(function (i) { return i.id === id; })[0]; }
  function entry(id) { return S.draft.entries[id]; }
  function summary() { return L.summarize(items(), ZONES, S.draft, { date: S.boot.date, fullCountDay: S.boot.fullCountDay }); }
  function meStaff() { return S.boot && S.boot.staff.filter(function (s) { return s.name === S.me; })[0]; }
  function isLead() { var m = meStaff(); return !!m && m.role === 'lead'; }

  // ---------- บันทึกผลนับ: เก็บในเครื่องก่อน แล้วค่อยส่งขึ้นหลังบ้าน (เน็ตหลุดไม่หาย) ----------
  function applyServerDraft(d) {
    var merged = JSON.parse(JSON.stringify(d || { entries: {} }));
    merged.entries = merged.entries || {};
    [S.inflight || {}, S.pending].forEach(function (layer) {
      Object.keys(layer).forEach(function (id) {
        if (layer[id] === null) delete merged.entries[id]; else merged.entries[id] = layer[id];
      });
    });
    S.draft = merged;
  }

  function setEntry(id, val) {
    var e = val === null ? null : { v: L.isNum(val.v) ? val.v : null, lv: val.lv || null, by: S.me, at: new Date().toISOString() };
    if (e) S.draft.entries[id] = e; else delete S.draft.entries[id];
    S.pending[id] = e;
    store.set('pending:' + S.boot.date, S.pending);
    scheduleSave(900);
    buzz();
  }

  function scheduleSave(ms) {
    clearTimeout(S.saveTimer);
    S.saveTimer = setTimeout(flush, ms);
  }

  function flush() {
    if (S.inflight || !S.boot) return Promise.resolve();
    var ids = Object.keys(S.pending);
    if (!ids.length) return Promise.resolve();
    var snap = S.pending;
    S.inflight = snap; S.pending = {};
    setNet('saving');
    var send = {};
    ids.forEach(function (id) { send[id] = snap[id] ? { v: snap[id].v, lv: snap[id].lv } : null; });
    return api('apiSave', S.pin, S.boot.date, S.me, send).then(function (d) {
      S.inflight = null;
      store.set('pending:' + S.boot.date, S.pending);
      applyServerDraft(d);
      setNet('ok');
      refreshLive();
      if (Object.keys(S.pending).length) scheduleSave(300);
    }, function (e) {
      Object.keys(snap).forEach(function (id) { if (!(id in S.pending)) S.pending[id] = snap[id]; });
      S.inflight = null;
      store.set('pending:' + S.boot.date, S.pending);
      if (/BAD_PIN/.test(errMsg(e))) return logout();
      if (/ไม่พบชื่อ/.test(errMsg(e))) { S.me = null; store.del('me'); toast(errMsg(e)); return boot(S.pin).catch(bootFail); }
      setNet('offline');
      scheduleSave(5000);
    });
  }

  function setNet(n) {
    S.net = n;
    var dot = document.querySelector('.top .net');
    if (dot) dot.className = 'net ' + n;
    var off = document.getElementById('offline-note');
    if (off) off.classList.toggle('hidden', n !== 'offline');
  }

  // ดึงผลนับของคนอื่นทุก 15 วินาที
  setInterval(function () {
    if (!S.boot || S.inflight || document.visibilityState !== 'visible') return;
    if (['home', 'zone', 'review'].indexOf(S.screen) < 0) return;
    api('apiDraft', S.pin, S.boot.date).then(function (d) {
      if (S.inflight) return;
      applyServerDraft(d);
      refreshLive();
    }, function () { /* เงียบไว้ รอบหน้าค่อยลอง */ });
  }, 15000);

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible' || !S.boot) return;
    if (L.businessDate() !== S.boot.date || Date.now() - S.bootAt > 30 * 60000) boot(S.pin, true).catch(bootFail);
  });

  // ---------- เริ่มต้น / เข้าระบบ ----------
  function start() {
    // ลิงก์ "สร้างใบสั่งซื้อ" จาก LINE (…/#po) → เข้าหน้าบอส แท็บสั่งซื้อ
    if (location.hash === '#po') {
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* */ }
      var ap = store.get('apin');
      S.afterAdmin = 'po';
      if (ap) {
        go('loading');
        loadAdmin(ap, 'po').then(function () { S.afterAdmin = null; }, function () { store.del('apin'); go('adminpin'); });
      } else go('adminpin');
      return;
    }
    // เปิดแอพทันทีด้วยข้อมูลที่เครื่องจำไว้ แล้วค่อยดึงของล่าสุดตามหลัง (ไม่ต้องรอ Google ตื่น)
    var cached = S.pin && store.get('boot');
    if (cached && cached.b && Date.now() - (cached.at || 0) < 7 * 86400000) {
      var b = cached.b, today = L.businessDate();
      if (b.date !== today) { b.date = today; b.draft = { entries: {} }; }
      S.boot = b; S.bootAt = 0; S.publicUrl = b.publicUrl || '';
      S.pending = store.get('pending:' + b.date) || {};
      applyServerDraft(b.draft);
      go(meStaff() ? 'home' : 'who');
      setNet('saving');
      boot(S.pin, true).then(function () { if (S.net === 'saving') setNet('ok'); }, function (e) {
        var m = errMsg(e);
        if (/FIRST_RUN/.test(m)) return go('firstrun');
        if (/BAD_PIN/.test(m)) return logout();
        setNet('offline');
      });
      return;
    }
    if (S.pin) {
      boot(S.pin).catch(function (e) {
        var m = errMsg(e);
        if (/FIRST_RUN/.test(m)) return go('firstrun');
        if (/BAD_PIN/.test(m)) return logout();
        S.error = m; go('error');
      });
    } else {
      api('apiStatus').then(function (st) { S.publicUrl = st.publicUrl || ''; go(st.firstRun ? 'firstrun' : 'pin'); }, function (e) { S.error = errMsg(e); go('error'); });
    }
  }

  function boot(pin, keepScreen) {
    return api('apiBootstrap', pin).then(function (b) {
      if (S.boot && S.boot.date !== b.date) { S.note = ''; S.result = null; }
      S.boot = b; S.bootAt = Date.now(); S.pin = pin; S.publicUrl = b.publicUrl || '';
      store.set('pin', pin);
      store.set('boot', { at: Date.now(), b: b });
      S.pending = store.get('pending:' + b.date) || {};
      applyServerDraft(b.draft);
      if (Object.keys(S.pending).length) scheduleSave(300);
      if (!meStaff()) { S.me = null; return go('who'); }
      if (!keepScreen) go('home'); else refreshLive();
    });
  }

  // โหลดข้อมูลเบื้องหลังไม่สำเร็จ: รหัสเปลี่ยน → ออกไปใส่ใหม่ · ระบบยังไม่ตั้งค่า → หน้าตั้งค่าครั้งแรก · อื่นๆ = เน็ต
  function bootFail(e) {
    var m = errMsg(e);
    if (/FIRST_RUN/.test(m)) return go('firstrun');
    if (/BAD_PIN/.test(m)) return logout();
    setNet('offline');
  }

  function logout() {
    store.del('pin'); store.del('boot'); S.pin = null; S.boot = null; S.pinBuf = ''; S.pinMsg = tr('wrongPin').th + ' · ' + tr('wrongPin').mm;
    go('pin');
  }

  // ---------- วาดหน้าจอ ----------
  function go(screen) {
    if (screen !== 'pin' && screen !== 'adminpin') { S.pinState = ''; S.pinBuf = ''; }
    else warmUp();
    S.screen = screen;
    if (screen !== 'zone' && screen !== 'review') S.kp = null;
    render();
    window.scrollTo(0, 0);
  }

  function render() {
    var f = SCREENS[S.screen] || SCREENS.loading;
    $app.innerHTML = f() + (S.kp ? keypadHtml() : '');
    keepTabsInView();
  }

  // แถบแท็บเลื่อนแนวนอน: วาดหน้าใหม่แล้วให้แท็บที่เลือกอยู่ยังอยู่ในจอ (ไม่เด้งกลับไปอันแรก)
  function keepTabsInView() {
    var bars = document.querySelectorAll('.tabs');
    for (var i = 0; i < bars.length; i++) {
      var on = bars[i].querySelector('.on');
      if (!on) continue;
      var b = bars[i].getBoundingClientRect(), r = on.getBoundingClientRect();
      bars[i].scrollLeft += (r.left + r.width / 2) - (b.left + b.width / 2);
    }
  }

  function rerenderKeepScroll() {
    var y = window.scrollY;
    render();
    window.scrollTo(0, y);
  }

  // อัปเดตเฉพาะส่วนที่เปลี่ยน (หลังบันทึก/ดึงผลของคนอื่น)
  function refreshLive() {
    var typing = document.activeElement && /^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName);
    if (S.screen === 'home' || (S.screen === 'review' && !typing && !S.kp)) rerenderKeepScroll();
    else if (S.screen === 'zone') {
      zoneItems(S.zone).forEach(function (it) { updateRow(it.id); });
      updateZoneHead();
    }
  }

  function newLinkBanner() {
    var url = S.publicUrl;
    if (API_URL || MOCK || !url) return '';
    return '<div class="wrap"><a class="note info" style="display:block;margin-top:10px;text-decoration:none" href="' + esc(url) + '" target="_blank" rel="noopener">' +
      '📢 แอพย้ายไปลิงก์ใหม่ (เปิดได้ทุกเครื่อง) — กดเพื่อเปิด แล้วเพิ่มลงหน้าจอหลักใหม่<br><span class="mm">' + esc(url) + '</span></a></div>';
  }

  function top(o) {
    o = o || {};
    return '<div class="top"><div class="wrap">' +
      (o.back ? '<button class="iconbtn" data-act="' + o.back + '" aria-label="กลับ">‹</button>' : '') +
      '<h1>' + esc(o.th) + (o.mm ? '<span class="mm">' + esc(o.mm) + '</span>' : '') + '</h1>' +
      (o.net === false ? '' : '<span class="net ' + S.net + '" title="สถานะบันทึก"></span>') +
      (o.me && S.me ? '<button class="chip-me" data-act="who">👤 ' + esc(S.me) + '</button>' : '') +
      '</div></div>' +
      '<div class="wrap"><div id="offline-note" class="note bad' + (S.net === 'offline' ? '' : ' hidden') + '" style="margin-top:10px">📶 ' + bi1('offline') + '</div></div>' + (['pin', 'who', 'home'].indexOf(S.screen) >= 0 ? newLinkBanner() : '');
  }

  // ป้อนรหัส: ครบหลักปุ๊บขึ้น "กำลังตรวจรหัส" ทันที (ล็อกแป้นกันกดซ้ำ) · ผิด = สั่น + แดง · ถูก = ไปหน้าถัดไป
  function pinPad(len, act) {
    var st = S.pinState || '', dots = '';
    for (var i = 0; i < len; i++) dots += '<i class="' + (i < S.pinBuf.length ? 'on' : '') + '"></i>';
    var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'].map(function (k) {
      if (!k) return '<span></span>';
      return '<button data-act="' + act + '" data-k="' + k + '"' + (k === '⌫' ? ' class="fn"' : '') + '>' + k + '</button>';
    }).join('');
    var msg = st === 'busy' ? '<span class="spin-sm"></span>กำลังตรวจรหัส… · <span class="mm">ခဏစောင့်ပါ…</span>' : esc(S.pinMsg);
    return '<div class="pin-dots ' + st + '">' + dots + '</div><div class="pin-msg ' + st + '">' + msg + '</div>' +
      '<div class="kp-grid pinpad' + (st === 'busy' ? ' busy' : '') + '" style="max-width:340px;margin:8px auto 0">' + keys + '</div>';
  }

  function pinInput(el, len, submit) {
    if (S.pinState === 'busy') return;
    var k = el.dataset.k;
    if (S.pinState === 'bad') { S.pinState = ''; S.pinMsg = ''; }
    if (k === '⌫') S.pinBuf = S.pinBuf.slice(0, -1);
    else if (S.pinBuf.length < len) S.pinBuf += k;
    buzz();
    if (S.pinBuf.length === len) { S.pinState = 'busy'; render(); submit(S.pinBuf); }
    else render();
  }

  function pinFail(e, badText) {
    var m = errMsg(e);
    S.pinBuf = '';
    S.pinState = 'bad';
    S.pinMsg = /BAD_PIN/.test(m) ? badText : isNetErr(e) ? tr('offline').th : m;
    render();
    try { if (navigator.vibrate) navigator.vibrate([60, 40, 60]); } catch (x) { /* */ }
  }

  // ปลุกหลังบ้านไว้ก่อนตอนเปิดหน้าใส่รหัส (Google หลับถ้าไม่มีคนใช้สักพัก ปลุกครั้งแรกช้า)
  function warmUp() {
    if (Date.now() - (S.lastApi || 0) > 45000) api('apiStatus').catch(function () { /* แค่ปลุก */ });
  }

  var SCREENS = {
    loading: function () {
      return '<div class="spinner"></div><p class="center muted">กำลังโหลด… · <span class="mm">ခဏစောင့်ပါ…</span></p>';
    },

    error: function () {
      return top({ th: tr('appTitle').th, mm: tr('appTitle').mm, net: false }) +
        '<div class="wrap screen"><div class="note bad" style="margin-top:20px">' + bi1('error') + '<br><small>' + esc(S.error) + '</small></div>' +
        '<div style="margin-top:16px"><button class="btn btn-primary" data-act="retry">ลองใหม่ · <span class="mm">ထပ်စမ်းမယ်</span></button></div></div>';
    },

    firstrun: function () {
      return top({ th: 'ตั้งค่าครั้งแรก (สำหรับบอส)', net: false }) +
        '<div class="wrap screen"><p class="sub" style="margin-top:14px">ตั้งรหัส 2 ชุด: <b>รหัสบอส 6 หลัก</b> (เข้าหน้าตั้งค่า) และ <b>รหัสร้าน 4 หลัก</b> (บอกทีมครัว ใส่ครั้งเดียวต่อเครื่อง)</p>' +
        '<div class="form card" style="padding:16px">' +
        '<div><label>รหัสตั้งค่าครั้งแรก</label><input id="f-code" type="tel" inputmode="numeric" maxlength="6" autocomplete="off">' +
        '<p class="muted" style="margin:6px 0 0;font-size:14px">ดูได้ใน Google Sheet <b>"สต็อคครัว บ้านขาวต้ม"</b> ใน Drive ของบอส → แท็บ <b>"รหัสตั้งค่าครั้งแรก"</b> (มีแค่บอสที่เปิดได้ — กันคนอื่นตั้งรหัสแทน)</p></div>' +
        '<div><label>รหัสบอส 6 หลัก (ตั้งใหม่)</label><input id="f-admin" type="tel" inputmode="numeric" maxlength="6" autocomplete="off"></div>' +
        '<div><label>รหัสร้าน 4 หลัก (ให้ทีมครัว)</label><input id="f-staff" type="tel" inputmode="numeric" maxlength="4" autocomplete="off"></div>' +
        '<div id="f-msg" class="pin-msg"></div>' +
        '<button class="btn btn-primary" data-act="firstRun">เริ่มใช้งาน</button></div></div>';
    },

    pin: function () {
      return top({ th: tr('appTitle').th, mm: tr('appTitle').mm, net: false }) +
        '<div class="wrap screen"><div class="title center" style="margin-top:24px">' + esc(tr('enterPin').th) + '</div>' +
        '<div class="center mm muted">' + esc(tr('enterPin').mm) + '</div>' + pinPad(4, 'pinKey') +
        '<p class="center" style="margin-top:28px"><button class="muted" data-act="toAdminPin" style="text-decoration:underline">บอส: เข้าหน้าตั้งค่า</button></p></div>';
    },

    adminpin: function () {
      return top({ th: 'หน้าตั้งค่า (บอส)', back: 'leaveAdminPin', net: false }) +
        '<div class="wrap screen"><div class="title center" style="margin-top:24px">ใส่รหัสบอส 6 หลัก</div>' +
        (S.afterAdmin === 'po' ? '<p class="center muted" style="margin:4px 0 0">เพื่อสร้างใบสั่งซื้อจากรอบนับล่าสุด</p>' : '') + pinPad(6, 'adminPinKey') +
        '<label class="check" style="justify-content:center;margin-top:18px;font-weight:500"><input type="checkbox" data-input="apinRemember"' + (S.apinRemember ? ' checked' : '') + '> จำรหัสบอสในเครื่องนี้ (มือถือบอสเท่านั้น)</label></div>';
    },

    who: function () {
      var staff = S.boot ? S.boot.staff : [];
      return top({ th: tr('appTitle').th, mm: tr('appTitle').mm }) +
        '<div class="wrap screen"><div class="title">' + bi('whoAreYou') + '</div><div class="who">' +
        staff.map(function (s) {
          return '<button class="card" data-act="pickMe" data-name="' + esc(s.name) + '">' +
            '<span class="av' + (s.role === 'lead' ? ' lead' : '') + '">' + esc((s.name.replace(/[^A-Za-z0-9ก-๙]/g, '') || s.name).slice(0, 2)) + '</span>' +
            '<span><b>' + esc(s.name) + '</b><span class="muted">' + bi1(s.role === 'lead' ? 'roleLead' : 'roleHelper') + '</span></span></button>';
        }).join('') + '</div>' + bossLink() + '</div>';
    },

    home: function () {
      var sum = summary(), b = S.boot;
      var due = ZONES.filter(function (z) { return sum.zones[z.id].due || sum.zones[z.id].started; });
      var later = ZONES.filter(function (z) { return due.indexOf(z) < 0; });
      var total = 0, counted = 0, below = 0;
      due.forEach(function (z) { total += sum.zones[z.id].total; counted += sum.zones[z.id].counted; below += sum.zones[z.id].below; });
      var pct = total ? Math.round(counted / total * 100) : 0;
      var sub = S.draft.submitted;
      var h = top({ th: tr('todayCount').th, mm: L.thaiDate(b.date), me: true }) + '<div class="wrap screen">';
      if (sub) {
        h += '<div class="note ok" style="margin-bottom:12px">✅ ' + bi1('sent') + ' ' + esc(L.bkkTime(sub.at)) + ' (' + esc(sub.by) + ')<br><small>' + bi1('resendHint') + '</small></div>';
      }
      h += '<div class="card hero"><div class="ring" style="--p:' + pct + '"><span>' + pct + '%</span></div><div>' +
        '<b>' + counted + ' / ' + total + ' ' + esc(tr('items').th) + '</b>' +
        '<div class="muted">' + bi1('counted') + '</div>' +
        (below ? '<div class="meta" style="margin-top:6px"><span class="tag bad">▼ ' + below + ' ' + bi1('belowMin') + '</span></div>' : '') +
        '</div></div>';
      h += recvCard();
      h += '<div class="zones" style="margin-top:14px">' + due.map(function (z) { return zoneCard(z, sum, false); }).join('') + '</div>';
      if (later.length) {
        h += '<div class="section-h">📅 ' + bi1('weeklyZone') + '</div><p class="sub" style="margin-top:-6px">' + bi1('optionalToday') + '</p>' +
          '<div class="zones">' + later.map(function (z) { return zoneCard(z, sum, true); }).join('') + '</div>';
      }
      h += bossLink() + '</div><div class="bottom"><div class="wrap">';
      if (isLead()) {
        h += '<button class="btn btn-primary stack" data-act="toReview">' + biIcon(sub ? '🔁' : '📤', 'reviewSend') + '</button>';
      } else {
        h += '<div class="note info center">👨‍🍳 ' + bi1('leadSends') + '</div>';
      }
      h += '<button class="btn btn-ghost" data-act="toUrgent">🚨 ' + bi1('urgent') + '</button></div></div>';
      return h;
    },

    zone: function () {
      var z = zoneOf(S.zone);
      var list = zoneItems(S.zone).filter(function (it) { return !S.onlyUncounted || !L.hasCount(entry(it.id)) || (S.kp && S.kp.id === it.id); });
      var h = top({ th: z.icon + ' ' + z.th, mm: z.mm, back: 'toHome' }) + '<div class="wrap screen">' +
        '<div class="filter"><span id="zone-prog" class="muted"></span>' +
        '<button class="toggle' + (S.onlyUncounted ? ' on' : '') + '" data-act="toggleUncounted">' + (S.onlyUncounted ? '☑ ' : '☐ ') + bi('onlyUncounted') + '</button></div>' +
        '<div class="list">' + list.map(rowHtml).join('') + '</div>';
      if (!list.length) h += '<div class="note ok center" style="margin-top:20px">✅ ' + bi1('done') + '</div>';
      h += '</div><div class="bottom"><div class="wrap"><button class="btn btn-primary" data-act="toHome">✓ ' + bi1('zoneDone') + '</button></div></div>';
      setTimeout(updateZoneHead, 0);
      return h;
    },

    review: function () {
      var sum = summary();
      var h = top({ th: tr('reviewSend').th, mm: tr('reviewSend').mm, back: 'toHome' }) + '<div class="wrap screen">';

      '<div class="nm"><b>' + esc(l.name_th) + '</b><span class="mm">' + esc(l.name_mm) + '</span>';

      h += '<div class="hint">' + esc(tr('ordered').th) + ' <b>' + L.fmtNum(l.ordered) + '</b> ' + unit + (l.prev ? ' · ได้แล้ว ' + L.fmtNum(l.prev) : '') +

  function copyText(text) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
      return ok ? Promise.resolve() : Promise.reject(new Error('copy'));
    }
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).catch(fallback);
    return fallback();
  }

  function zoneCard(z, sum, optional) {
    var st = sum.zones[z.id];
    var pct = st.total ? Math.round(st.counted / st.total * 100) : 0;
    var done = st.total && st.counted === st.total;
    var status = done ? '<span class="tag ok">✓ ' + bi1('done') + '</span>'
      : st.counted ? '<span class="tag brand">' + bi1('inProgress') + '</span>' + (st.by.length ? '<span class="tag">👤 ' + esc(st.by.join(', ')) + '</span>' : '')
        : '<span class="tag">' + bi1('notStarted') + '</span>';
    return '<button class="card zone' + (done ? ' done' : '') + (optional ? ' optional' : '') + '" data-act="openZone" data-z="' + z.id + '">' +
      '<span class="ic">' + z.icon + '</span><span class="tx"><b>' + esc(z.th) + '</b><span class="mm">' + esc(z.mm) + '</span>' +
      '<span class="meta">' + status + (st.below ? '<span class="tag bad">▼ ' + st.below + '</span>' : '') + '</span>' +
      '<span class="bar"><i style="width:' + pct + '%"></i></span></span>' +
      '<span class="cnt">' + st.counted + '/' + st.total + '<small>' + esc(tr('items').th) + '</small></span></button>';
  }

  function needLabel(it) { return it.kind === 'prep' ? 'toMake' : 'toBuy'; }

  function rowHtml(it) {
    var e = entry(it.id), cfg = L.isConfigured(it), has = L.hasCount(e);
    var need = cfg && has ? L.needQty(it, e.v) : null;
    var lowlv = !cfg && has && (e.lv === 'low' || e.lv === 'out');
    var cls = 'card row' + (has ? ' counted' : '') + (need > 0 || (lowlv && e.lv === 'out') ? ' below' : lowlv ? ' lowlv' : '') + (S.kp && S.kp.id === it.id ? ' active' : '');
    var hint = cfg
      ? '<span>Min ' + L.fmtNum(it.min) + ' · Max ' + L.fmtNum(it.max) + ' ' + esc(L.unitText(it)) + '</span>'
      : '<span class="tag warn">⚠️ ' + bi1('notSetShort') + '</span>';
    if (cfg && it.unit_mm) hint += ' <span class="mm">(' + esc(it.unit_mm) + ')</span>';
    if (has && e.by && e.by !== S.me) hint += ' <span class="tag">' + esc(tr('countedBy').th) + ' ' + esc(e.by) + '</span>';
    var h = '<div class="' + cls + '" id="r-' + esc(it.id) + '"><div class="nm"><b>' + esc(it.name_th) + '</b><span class="mm">' + esc(it.name_mm) + '</span>' +
      '<div class="hint">' + hint + '</div>';
    if (need > 0) {
      var nl = tr(needLabel(it));
      h += '<div class="need"><span class="tag bad"><b>' + esc(nl.th) + ' ' + L.fmtNum(need) + ' ' + esc(it.unit) + '</b><span class="mm">' + esc(nl.mm) + ' ' + L.fmtNum(need) + (it.unit_mm ? ' ' + esc(it.unit_mm) : '') + '</span></span></div>';
    }
    if (!cfg) {
      h += '<div class="levels" style="margin-top:8px">' + ['ok', 'low', 'out'].map(function (lv) {
        var k = lv === 'ok' ? 'enough' : lv;
        return '<button class="' + lv + (has && e.lv === lv ? ' on' : '') + '" data-act="setLv" data-id="' + esc(it.id) + '" data-v="' + lv + '">' + esc(tr(k).th) + '<small class="mm">' + esc(tr(k).mm) + '</small></button>';
      }).join('') + '</div></div>';
    } else {
      h += '</div><div class="step"><button data-act="dec" data-id="' + esc(it.id) + '" aria-label="ลด">−</button>' +
        '<button class="val' + (has ? '' : ' empty') + '" data-act="kp" data-id="' + esc(it.id) + '">' + (has ? L.fmtNum(e.v) : '–') + '</button>' +
        '<button data-act="inc" data-id="' + esc(it.id) + '" aria-label="เพิ่ม">+</button></div>';
    }
    return h + '</div>';
  }

      h += '<label class="ph add' + (u.busy ? ' busy' : '') + '">' + (u.busy ? bi('photoBusy') : '<span class="ic">📷</span>' + bi('addPhoto')) +

    }

  // ย่อรูปในเครื่องก่อนส่ง (ด้านยาวสุด 1280px) — รูปมือถือ 3-5MB เหลือราว 150-300KB
  function resizeImage(file) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var s = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
        var c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res(c.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('อ่านรูปไม่ได้ ลองรูปอื่น')); };
      img.src = url;
    });
  }

  function parseBuf(buf) {

  function kpAdvance() {
    var cur = S.kp && S.kp.id;
    if (S.screen !== 'zone') { S.kp = null; rerenderKeepScroll(); return; }
    var list = zoneItems(S.zone);
    var idx = list.map(function (i) { return i.id; }).indexOf(cur);
    var next = null;
    for (var i = idx + 1; i < list.length; i++) {
      if (!S.onlyUncounted || !L.hasCount(entry(list[i].id))) { next = list[i]; break; }
    }
    if (!next) {
      S.kp = null;
      rerenderKeepScroll();
      toast('✅ ' + tr('done').th + ' · ' + tr('done').mm);
      return;

    openKp(next.id, 'zone');

  // รอให้ผลนับทั้งหมดขึ้นหลังบ้านก่อนส่ง (สูงสุด ~20 วินาที)
  function waitSaved() {
    return new Promise(function (res, rej) {
      var tries = 0;
      (function loop() {
        if (!S.inflight && !Object.keys(S.pending).length) return res();
        if (++tries > 40) return rej(new Error('network: ยังบันทึกไม่ขึ้น'));
        if (!S.inflight) flush();
        setTimeout(loop, 500);
      })();
    });
  }

  // รอให้บอสพิมพ์รหัสในกลุ่ม แล้วเช็คว่าบอทยืนยันหรือยัง (ทุก 5 วินาที ไม่เกิน 30 นาที)
  function waitGroupLink() {
    var A = S.admin, started = Date.now();
    A.linkWaiting = true;
    (function poll() {
      if (!S.admin || S.admin !== A || !A.linkCode) return;
      if (Date.now() - started > 30 * 60000) { A.linkWaiting = false; return; }
      api('apiAdminLoad', A.pin).then(function (d) {
        if (d.settings.groupLinked && !d.settings.linkPending) {
          A.data.settings = d.settings; A.linkCode = ''; A.linkWaiting = false;
          A.groupMsg = 'เชื่อมกลุ่มแล้ว ✓' + (d.settings.groupName ? ' (' + d.settings.groupName + ')' : '');
          if (S.screen === 'admin') rerenderKeepScroll();
          toast('✅ เชื่อมกลุ่ม LINE แล้ว');
        } else setTimeout(poll, 5000);
      }, function () { setTimeout(poll, 8000); });
    })();
  }

  function readEditForm() {
    var g = function (id) { return document.getElementById(id); };
    var n = function (id) { var v = g(id).value.trim(); return v === '' ? null : Number(v); };
    var it = JSON.parse(JSON.stringify(S.admin.edit));
    it.zone = g('e-zone').value; it.name_th = g('e-th').value.trim(); it.name_mm = g('e-mm').value.trim();
    it.mm_auto = S.admin.edit.mm_auto === true;
    it.min = n('e-min'); it.max = n('e-max'); it.unit = g('e-unit').value.trim(); it.unit_mm = g('e-umm').value.trim();
    it.size = g('e-size').value.trim(); it.step = n('e-step'); it.active = g('e-active').checked;
    it.buy_unit = g('e-bunit').value.trim(); it.buy_factor = it.buy_unit ? n('e-bfactor') : null; it.buy_step = n('e-bstep');
    return it;
  }
