      '<i class="tg k' + (it.kind === 'prep' ? ' prep' : '') + '">' + (it.kind === 'prep' ? '🔪 ตัดแต่งแล้ว' : '🛒 ยังไม่ตัดแต่ง') + '</i></span>';
  }

  // ---------- รายงานการนับย้อนหลัง ----------
  function loadReports(more) {
    var A = S.admin, R = A.rep || (A.rep = { list: [], more: false });
    R.loading = true;
    if (S.screen === 'admin') rerenderKeepScroll();
    var before = more && R.list.length ? R.list[R.list.length - 1].date : '';
    return api('apiAdminReports', A.pin, before, 40).then(function (r) {
      R.list = more ? R.list.concat(r.list) : r.list; R.more = r.more; R.loading = false; R.err = '';
      if (!more) adminCacheSave();
      if (S.screen === 'admin') rerenderKeepScroll();
    }, function (e) { R.loading = false; R.err = errMsg(e); if (S.screen === 'admin') rerenderKeepScroll(); });
  }

  function reportsSection() {
    var R = S.admin.rep;
    var h = '<div class="section-h">📜 รายงานการนับย้อนหลัง</div>';
    if (!R || (R.loading && !R.list.length)) return h + '<p class="muted"><span class="spin-sm"></span>กำลังโหลด…</p>';
    if (R.err && !R.list.length) return h + '<div class="note bad">' + esc(R.err) + '</div>';
    if (!R.list.length) return h + '<p class="muted">ยังไม่มีรายงาน — จะขึ้นเมื่อ MON กดส่งรายงานครั้งแรก</p>';
    var month = '';
    h += '<div class="list">' + R.list.map(function (r) {
      var m = L.thaiDate(r.date).split(' ').slice(2).join(' '), head = '';
      if (m !== month) { month = m; head = '<div class="rep-month">' + esc(m) + '</div>'; }
      return head + '<button class="card rep-card" data-act="repOpen" data-v="' + esc(r.date) + '">' +
        '<div class="dr-top"><b>' + esc(L.thaiDate(r.date)) + '</b><span class="muted" style="font-size:13px">' + esc(L.bkkTime(r.at)) + ' · ' + esc(r.by) + (r.sends > 1 ? ' · ส่ง ' + r.sends + ' ครั้ง' : '') + '</span></div>' +
        ((r.sections || []).length ? '<small class="muted" style="display:block">👥 ' + esc(r.sections.join(', ')) + '</small>' : '') +
        '<div class="tagline">' + '<i class="tg">✏️ นับ ' + r.counted + '</i>' +
        (r.buy ? '<i class="tg k" style="background:var(--bad-soft);color:var(--bad)">🛒 ซื้อ ' + r.buy + '</i>' : '<i class="tg k">🛒 ไม่ต้องซื้อ</i>') +
        (r.prep ? '<i class="tg k prep">🔪 ทำเพิ่ม ' + r.prep + '</i>' : '') +
        (r.attention ? '<i class="tg k prep">⚠️ ต้องดู ' + r.attention + '</i>' : '') +
        (r.uncounted ? '<i class="tg k">⏳ ไม่ได้นับ ' + r.uncounted + '</i>' : '') + '</div>' +
        (r.note ? '<small class="muted" style="display:block;margin-top:4px">📝 ' + esc(r.note) + '</small>' : '') + '</button>';
    }).join('') + '</div>' +
      (R.more ? '<button class="btn btn-ghost" style="margin-top:10px" data-act="repMore"' + (R.loading ? ' disabled' : '') + '>' + (R.loading ? 'กำลังโหลด…' : 'ดูเก่ากว่านี้') + '</button>' : '');
    return h;
  }

  function reportDayScreen() {
    var A = S.admin, D = A.repDay, f = A.repF || 'all', q = A.repQ || '';
    var h = top({ th: '📜 ' + (D ? L.thaiDate(D.date) : ''), back: 'repBack', net: false }) + '<div class="wrap screen">';
    if (!D || D.loading) return h + '<p class="muted center"><span class="spin-sm"></span>กำลังโหลด…</p></div>';
    var rows = D.rows, last = D.sends[0];
    var buy = rows.filter(function (r) { return r.need > 0 && r.kind !== 'prep'; }), prep = rows.filter(function (r) { return r.need > 0 && r.kind === 'prep'; });
    var low = rows.filter(function (r) { return r.level === 'low' || r.level === 'out'; });
    var countedIds = {};
    rows.forEach(function (r) { countedIds[r.item_id] = true; });
    var missing = A.data.items.filter(function (it) { return it.active !== false && !countedIds[it.id]; });
    h += '<div class="card" style="padding:14px 16px">' + (last ? '<b>ส่งโดย ' + esc(last.by) + ' · ' + esc(L.bkkTime(last.at)) + '</b>' + (D.sends.length > 1 ? ' <span class="muted">(ส่ง ' + D.sends.length + ' ครั้ง ใช้ครั้งล่าสุด)</span>' : '') +
      (last.counters ? '<div class="muted" style="font-size:14px">ช่วยนับ: ' + esc(last.counters) + '</div>' : '') +
      ((last.note_th || last.note) ? '<div style="margin-top:6px">📝 ' + esc(last.note_th || last.note) + '</div>' : '') : '<span class="muted">วันนี้ไม่มีการกดส่ง</span>') + '</div>';
    var chips = [['all', 'ทั้งหมด ' + rows.length], ['buy', '🛒 ต้องซื้อ ' + buy.length], ['prep', '🔪 ทำเพิ่ม ' + prep.length]]
      .concat(low.length ? [['low', '⚠️ ใกล้หมด/หมด ' + low.length]] : []).concat([['miss', '⏳ ไม่ได้นับ ' + missing.length]]);
    h += '<div class="tabs" style="padding-top:12px">' + chips.map(function (c) { return '<button class="' + (f === c[0] ? 'on' : '') + '" data-act="repFilter" data-v="' + c[0] + '">' + esc(c[1]) + '</button>'; }).join('') + '</div>' +
      '<input class="inp" style="margin:8px 0 10px" data-input="repQ" type="search" autocomplete="off" placeholder="🔍 ค้นหาในวันนี้" value="' + esc(q) + '">' +
      '<div id="rep-body">' + reportDayBody() + '</div>';
    if (D.sends.length) {
      h += '<div class="section-h">💬 ข้อความที่ส่ง LINE</div><div class="list">' + D.sends.map(function (x, i) {
        return '<details class="card hist"' + (i === 0 ? ' open' : '') + '><summary><span>' + esc(L.bkkTime(x.at)) + ' · ' + esc(x.by) + (x.section ? ' · 👥 ' + esc(x.section) : '') + (i === 0 ? ' (ล่าสุด)' : '') + '</span>' + statusLabel(x.status) + '</summary><pre>' + esc(x.message) + '</pre>' +
          '<button class="mini-link" data-act="repCopy" data-i="' + i + '">📋 คัดลอกข้อความ</button></details>';
      }).join('') + '</div>';
    }
    return h + '</div>';
  }

  function reportDayBody() {
    var A = S.admin, D = A.repDay, f = A.repF || 'all';
    if (f === 'miss') {
      var countedIds = {};
      D.rows.forEach(function (r) { countedIds[r.item_id] = true; });
      var miss = A.data.items.filter(function (it) { return it.active !== false && !countedIds[it.id] && matchItem(it, A.repQ); });
      return '<p class="muted" style="font-size:13px;margin:0 0 8px">เทียบกับรายการของตอนนี้ (รายการที่เพิ่มทีหลังจะขึ้นที่นี่ด้วย)</p>' +
        (miss.length ? '<div class="card sum-list" style="padding:4px 16px">' + miss.map(function (it) {
          return '<div class="sum-row"><div class="nm"><b>' + esc(it.name_th) + '</b><span class="mm">' + esc(it.name_mm) + '</span></div><div class="q"><small>' + esc(L.itemLocs(it).map(function (z) { return zoneOf(z).icon + ' ' + zoneOf(z).th; }).join(', ')) + '</small></div></div>';
        }).join('') + '</div>' : (normQ(A.repQ) ? '<p class="muted">ไม่มีรายการที่ตรงกับคำค้น</p>' : '<div class="note ok">✅ นับครบทุกรายการ</div>'));
    }
    var rows = D.rows.filter(function (r) {
      if (!matchItem(r, A.repQ)) return false;
      if (f === 'buy') return r.need > 0 && r.kind !== 'prep';
      if (f === 'prep') return r.need > 0 && r.kind === 'prep';
      if (f === 'low') return r.level === 'low' || r.level === 'out';
      return true;
    });
    if (!rows.length) return '<p class="muted">ไม่มีรายการ</p>';
    var groups = {}, order = [];
    rows.forEach(function (r) { if (!groups[r.zone]) { groups[r.zone] = []; order.push(r.zone); } groups[r.zone].push(r); });
    order.sort(function (a, b) { var ia = ZONES.indexOf(zoneOf(a)), ib = ZONES.indexOf(zoneOf(b)); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
    return order.map(function (z) {
      var zz = zoneOf(z);
      return '<div class="zone-label">' + esc(zz.icon + ' ' + zz.th) + '</div><div class="card sum-list" style="padding:4px 16px;margin-bottom:10px">' + groups[z].map(function (r) {
        var val = r.qty !== null ? L.fmtNum(r.qty) + ' ' + esc(r.unit) : esc((L.LEVEL_TH || {})[r.level] || r.level || '–');
        var tag = r.need > 0 ? '<span class="tag ' + (r.kind === 'prep' ? 'warn' : 'bad') + '">' + (r.kind === 'prep' ? 'ทำเพิ่ม ' : 'สั่ง ') + L.fmtNum(r.need) + '</span>' : '';
        return '<div class="sum-row"><div class="nm"><b>' + esc(r.name_th) + '</b><span class="mm">' + esc(r.name_mm) + '</span>' +
          '<small class="muted" style="display:block;font-size:12px">' + (r.min !== null ? 'Min ' + L.fmtNum(r.min) + ' · Max ' + L.fmtNum(r.max) + ' · ' : '') + '👤 ' + esc(r.by || '-') + (r.at ? ' ' + esc(L.bkkTime(r.at)) : '') + '</small></div>' +
          '<div class="q"><b>' + val + '</b>' + tag + '</div></div>';
      }).join('') + '</div>';
    }).join('');
  }

        '<div class="seg"><button class="' + (pk === 'new' ? 'on' : '') + '" data-act="mmRevPick" data-id="' + esc(it.id) + '" data-v="new">ใช้ชื่อใหม่</button>' +
        '<button class="' + (pk === 'keep' ? 'on' : '') + '" data-act="mmRevPick" data-id="' + esc(it.id) + '" data-v="keep">คงเดิม</button>' +
        '<button class="' + (pk === 'mon' ? 'on' : '') + '" data-act="mmRevPick" data-id="' + esc(it.id) + '" data-v="mon">✓ MON ตรวจแล้ว (ใช้ชื่อใหม่)</button></div></div>';
    }).join('') + '</div>';
    var nSave = Object.keys(R.pick).filter(function (id) { return R.pick[id] === 'new' || R.pick[id] === 'mon'; }).length;
    h += '</div><div class="bottom"><div class="wrap"><button class="btn btn-primary" data-act="mmRevSave"' + (nSave && !R.saving ? '' : ' disabled') + '>' +
      (R.saving ? 'กำลังบันทึก…' : '💾 บันทึกชื่อใหม่ (' + nSave + ')') + '</button></div></div>';
    return h;
  }

  // รอให้บอสพิมพ์รหัสในกลุ่ม แล้วเช็คว่าบอทยืนยันหรือยัง (ทุก 5 วินาที ไม่เกิน 30 นาที)
  function waitGroupLink() {
    var A = S.admin, started = Date.now();
    A.linkWaiting = true;
    (function poll() {
      if (!S.admin || S.admin !== A || !A.linkCode) return;
      if (Date.now() - started > 30 * 60000) { A.linkWaiting = false; return; }
      api('apiAdminLoad', A.pin, true).then(function (d) {
        if (d.settings.groupLinked && !d.settings.linkPending) {
          d.settings.claudeUsage = A.data.settings.claudeUsage;
          A.data.settings = d.settings; A.linkCode = ''; A.linkWaiting = false;
          A.groupMsg = 'เชื่อมกลุ่มแล้ว ✓' + (d.settings.groupName ? ' (' + d.settings.groupName + ')' : '');
          if (S.screen === 'admin') rerenderKeepScroll();
          toast('✅ เชื่อมกลุ่ม LINE แล้ว');
        } else setTimeout(poll, 5000);
      }, function () { setTimeout(poll, 8000); });
    })();
  }

  // แท็กที่เก็บในฟอร์มแก้รายการ (แตะสลับ) + ปุ่มสร้างที่ใหม่
  function placeTags(it) {
    return ZONES.map(function (z) {
      return '<button class="tagc' + (it._places.indexOf(z.id) >= 0 ? ' on' : '') + '" data-act="tagPlace" data-v="' + esc(z.id) + '">' + esc(z.icon + ' ' + z.th) + '</button>';
    }).join('') + '<button class="tagc add" data-act="tagNewPlace">＋ ที่ใหม่</button>';
  }

  function adminEditScreen() {
    var A = S.admin, it = A.edit;
    if (!it._places) it._places = L.itemLocs({ zone: it.zone, more_zones: it.more_zones, min: 1, max: 2, unit: 'x' });
    var units = Object.keys(UNITS).map(function (u) { return '<option value="' + esc(u) + '">'; }).join('');
    var num = function (v) { return v === null || v === undefined ? '' : v; };
    return top({ th: it.isNew ? 'เพิ่มรายการ' : 'แก้รายการ', back: 'aBack', net: false }) + '<div class="wrap screen">' +
      (it.setup_note ? '<div class="note warn" style="margin-bottom:12px">⚠️ ' + esc(it.setup_note) + '</div>' : '') +
      (it.info ? '<div class="note info" style="margin-bottom:12px">ℹ️ ' + esc(it.info) + '</div>' : '') +
      '<div class="card form" style="padding:16px">' +
      '<div><label>📍 ที่เก็บ <span class="muted" style="font-weight:500">(แตะเลือก ได้หลายที่ — อยู่หลายที่ น้องนับแยกแต่ละที่ แอพรวมยอดให้)</span></label>' +
      '<div class="tagbox" id="e-places">' + placeTags(it) + '</div></div>' +
      '<div><label>🏷️ ประเภท</label><div class="tagbox">' +
      '<button class="tagc kind' + (it.kind !== 'prep' ? ' on' : '') + '" data-act="tagKind" data-v="buy">🛒 ยังไม่ตัดแต่ง <small>(ซื้อมา · ขาด = สั่งซื้อ)</small></button>' +
      '<button class="tagc kind' + (it.kind === 'prep' ? ' on' : '') + '" data-act="tagKind" data-v="prep">🔪 ตัดแต่งแล้ว/ทำเอง <small>(ขาด = ครัวทำเพิ่ม)</small></button></div></div>' +
      '<div><label>ชื่อไทย</label><input type="text" id="e-th" data-input="aNameTh" value="' + esc(it.name_th) + '"></div>' +
      '<div><label>ชื่อพม่า <span class="tag ' + (it.mm_auto === 'mon' ? 'ok' : it.mm_auto === 'claude' ? 'brand' : 'warn') + (it.mm_auto ? '' : ' hidden') + '" id="e-mm-tag">' + mmTagText(it.mm_auto) + '</span></label>' +
      '<div style="display:flex;gap:8px"><input type="text" id="e-mm" class="mm" data-input="aNameMm" value="' + esc(it.name_mm) + '" style="flex:1">' +
      '<button class="btn btn-ghost" style="width:auto;min-height:48px;padding:0 12px;font-size:14px" data-act="aTranslate">🌐 แปล</button></div>' +
      '<div id="e-mm-note" class="muted" style="font-size:13px;margin-top:4px"></div></div>' +
      '<div class="two"><div><label>Min (ต่ำกว่านี้ = สั่ง)</label><input type="number" id="e-min" inputmode="decimal" step="any" min="0" value="' + num(it.min) + '"></div>' +
      '<div><label>Max (เติมให้ถึง)</label><input type="number" id="e-max" inputmode="decimal" step="any" min="0" value="' + num(it.max) + '"></div></div>' +
      '<div class="two"><div><label>หน่วย</label><input type="text" id="e-unit" list="unit-list" data-input="aUnit" value="' + esc(it.unit) + '"><datalist id="unit-list">' + units + '</datalist></div>' +
      '<div><label>หน่วยพม่า</label><input type="text" id="e-umm" class="mm" data-input="aUmm" value="' + esc(it.unit_mm) + '" placeholder="ว่าง = เติมให้อัตโนมัติ"></div></div>' +
      '<div class="two"><div><label>ขนาดต่อหน่วย (ถ้ามี)</label><input type="text" id="e-size" placeholder="เช่น 1000g" value="' + esc(it.size) + '"></div>' +
      '<div><label>ปุ่ม +/− เพิ่มทีละ</label><input type="number" id="e-step" inputmode="decimal" step="any" min="0" value="' + num(it.step || 1) + '"></div></div>' +
      '<div class="sub-h">🛒 หน่วยซื้อ <span class="muted">(ใส่เมื่อซื้อคนละหน่วยกับที่นับ เช่น ซื้อกุ้งเป็น กก. แต่นับเป็นตัว)</span></div>' +
      '<div class="two"><div><label>หน่วยซื้อ</label><input type="text" id="e-bunit" list="unit-list" value="' + esc(it.buy_unit || '') + '" placeholder="ว่าง = หน่วยเดียวกับที่นับ"></div>' +
      '<div><label id="e-bf-label">1 หน่วยซื้อ ≈ กี่ ' + esc(it.unit || 'หน่วยนับ') + '</label><input type="number" id="e-bfactor" inputmode="decimal" step="any" min="0" value="' + num(it.buy_factor) + '" placeholder="เช่น 40"></div></div>' +
      '<div><label>ปัดจำนวนสั่งขึ้นทีละ</label><input type="number" id="e-bstep" inputmode="decimal" step="any" min="0" value="' + num(it.buy_step) + '" placeholder="ว่าง = นับเป็นชิ้นปัดเป็นจำนวนเต็ม, น้ำหนักไม่ปัด"></div>' +
      '<label class="check"><input type="checkbox" id="e-active"' + (it.active !== false ? ' checked' : '') + '> ใช้งาน (เอาติ๊กออก = ซ่อนจากหน้านับ)</label>' +
      '<div id="e-msg" class="pin-msg"></div>' +
      '<button class="btn btn-primary" data-act="aSave">บันทึก</button>' +
      (it.isNew ? '' : '<p class="muted center" style="margin:0;font-size:14px">เปลี่ยนลำดับ: แท็บ "รายการของ" → ↕️ จัดลำดับ</p>') +
      (it.isNew ? '' : '<button class="btn btn-danger" data-act="aDelItem">🗑️ ลบรายการนี้</button>') +
      '</div>' + (it.isNew ? '' : recipeEditCard(it)) + '</div>';
  }

  // สูตร = วัตถุดิบต่อ 1 รอบผลิต — พิมพ์แบบเดียวกับใบสั่ง (ชื่อ จำนวน หน่วย ทีละบรรทัด) แอพจับคู่กับรายการของให้
  function recipeEditCard(it) {
    var rc = (S.admin.data.recipes || {})[it.id] || null;
    var text = rc ? rc.lines.map(function (l) { return l.name + ' ' + L.fmtNum(l.qty) + ' ' + l.unit; }).join('\n') : '';
    return '<div class="card form" style="padding:16px;margin-top:12px"><b>🧾 สูตร: วัตถุดิบต่อ 1 รอบผลิต' + (rc ? ' <span class="tag ok">ตั้งแล้ว</span>' : '') + '</b>' +
      '<p class="muted" style="margin:0;font-size:13.5px">ของนี้ต่ำกว่า Min → รายงาน LINE บอกวัตถุดิบที่ต้องซื้อ + มีในปุ่ม "สร้างใบสั่งจากรอบนี้" + หน้าน้องโชว์ว่าใช้อะไร · พิมพ์ทีละบรรทัด เช่น <b>กะหล่ำปลี 2 กก.</b></p>' +
      '<textarea id="e-rc" data-input="rcText" rows="6" placeholder="กะหล่ำปลี 2 กก.&#10;หัวไชเท้า 2 กก.&#10;กระดูกหมู 2 กก.">' + esc(text) + '</textarea>' +
      '<div id="e-rc-pv">' + recipePreview(text) + '</div>' +
      '<div><label>1 รอบทำได้ประมาณ (' + esc(it.unit || 'หน่วยนับ') + ')</label><input type="number" id="e-rc-y" inputmode="decimal" step="any" min="0" value="' + (rc && rc.yield ? rc.yield : '') + '" placeholder="ไม่รู้เว้นว่าง = ต่ำกว่า Min ทำ 1 รอบ"></div>' +
      '<button class="btn btn-primary" data-act="aSaveRecipe">💾 บันทึกสูตร</button></div>';
  }
  function recipeParse(text) {
    var items = S.admin.data.items.filter(function (x) { return x.active !== false; });
    var out = [];
    L.parseOrderText(text).forEach(function (b) {
      b.lines.forEach(function (l) {
        var m = L.matchItemName(l.name, items);
        out.push({ raw: l.raw, name: l.name, qty: l.qty, unit: l.unit, item: m.item || null });
      });
    });
    return out;
  }
  function recipePreview(text) {
    var ls = recipeParse(text);
    if (!ls.length) return '';
    return '<div class="list" style="gap:4px">' + ls.map(function (l) {
      if (!(l.qty > 0)) return '<small class="muted">⚠️ อ่านจำนวนไม่ได้: ' + esc(l.raw) + '</small>';
      return '<small>' + (l.item ? '✓ <b>' + esc(l.item.name_th) + '</b>' : '➕ <b>' + esc(l.name) + '</b> <span class="muted">(ของนอกรายการ — สั่งได้ แต่ไม่นับสต็อค)</span>') +
        ' ' + L.fmtNum(l.qty) + ' ' + esc(l.unit) + '</small>';
    }).join('') + '</div>';
  }

  function readEditForm() {
    var g = function (id) { return document.getElementById(id); };
    var n = function (id) { var v = g(id).value.trim(); return v === '' ? null : Number(v); };
    var it = JSON.parse(JSON.stringify(S.admin.edit));
    // ที่เก็บเรียงตามลำดับหมวด — อันแรกเก็บใน zone ที่เหลือใน more_zones (บอสไม่ต้องรู้)
    var places = ZONES.map(function (z) { return z.id; }).filter(function (id) { return S.admin.edit._places.indexOf(id) >= 0; });
    it.zone = places[0] || ''; it.more_zones = places.slice(1).join(',');
    it.kind = S.admin.edit.kind === 'prep' ? 'prep' : 'buy';
    delete it._places;
    it.name_th = g('e-th').value.trim(); it.name_mm = g('e-mm').value.trim();
    it.mm_auto = S.admin.edit.mm_auto || '';
    it.min = n('e-min'); it.max = n('e-max'); it.unit = g('e-unit').value.trim(); it.unit_mm = g('e-umm').value.trim();
    it.size = g('e-size').value.trim(); it.step = n('e-step'); it.active = g('e-active').checked;
    it.buy_unit = g('e-bunit').value.trim(); it.buy_factor = it.buy_unit ? n('e-bfactor') : null; it.buy_step = n('e-bstep');
    return it;
  }

  function adminSaveItems(list) {
    return api('apiAdminSaveItems', S.admin.pin, list, { fast: true }).then(function (all) {
      S.admin.data.items = all;
      if (S.boot) S.boot.items = all.filter(function (i) { return i.active !== false; });
      // ชื่อพม่าที่เพิ่งได้จาก Google (บันทึกเร็ว) → ให้ Claude แปลให้ดีขึ้นตามหลัง
      var ids = list.map(function (x) { return x.id; });
      var weak = all.filter(function (i) { return ids.indexOf(i.id) >= 0 && i.mm_auto === 'google'; }).map(function (i) { return i.id; });
      if (weak.length && S.admin.data.settings && S.admin.data.settings.claudeKey) upgradeMm(weak);
    });
  }
  // บันทึกที่เก็บ: เร็ว (ชื่อพม่าว่าง = Google ก่อน) แล้วให้ Claude แปลตามหลัง
  function saveZones(pin, list) {
    var blank = list.filter(function (z) { return !L.hasBurmese(z.mm); }).map(function (z) { return z.th; });
    return api('apiAdminSaveZones', pin, list, { fast: true }).then(function (r) {
      var pairs = (r.zones || []).filter(function (z) { return blank.indexOf(z.th) >= 0; }).map(function (z) { return { id: z.id, mm: z.mm }; });
      if (pairs.length && S.admin && S.admin.data.settings && S.admin.data.settings.claudeKey) {
        api('apiAdminUpgradeZoneMm', pin, pairs).then(function (u) {
          if (!u || !u.done) return;
          useZones(u.zones); if (S.boot) S.boot.zones = u.zones; if (S.admin) { S.admin.data.zones = u.zones; adminCacheSave(); }
          toast('✨ Claude แปลชื่อที่เก็บให้แล้ว ' + u.done + ' ที่');
          if (S.screen === 'admin' || S.screen === 'azones') rerenderKeepScroll();
        }, function () { /* ชื่อจาก Google ยังใช้ได้ */ });
      }
      return r;
    });
  }
  function upgradeMm(ids) {
    var A = S.admin;
    api('apiAdminUpgradeMm', A.pin, ids).then(function (r) {
      if (!r || !r.done || S.admin !== A) return;
      A.data.items = r.items;
      if (S.boot) S.boot.items = r.items.filter(function (i) { return i.active !== false; });
      adminCacheSave();
      toast('✨ Claude แปลชื่อพม่าให้แล้ว ' + r.done + ' รายการ');
      if (S.screen === 'admin') rerenderKeepScroll();
    }, function () { /* ไม่เป็นไร ชื่อจาก Google ยังใช้ได้ กดแปลใหม่ทีหลังได้ */ });
  }

  // เปลี่ยนหน่วยไทย → เติมหน่วยพม่าให้ตาม (ยกเว้นบอสพิมพ์หน่วยพม่าเองแล้ว)
  var mmTimer = null;
  function mmTagText(engine) {
    return engine === 'mon' ? '✓ MON ตรวจแล้ว' : engine === 'claude' ? '✨ Claude แปล — ให้ MON ดูอีกที' : engine ? '🌐 Google แปล — ควรให้ MON ช่วยดู' : '';
  }
  function mmNote(text) { var n = document.getElementById('e-mm-note'); if (n) n.textContent = text || ''; }
  function mmTag(engine) {
    var t = document.getElementById('e-mm-tag');
    if (!t) return;
    t.className = 'tag ' + (engine === 'mon' ? 'ok' : engine === 'claude' ? 'brand' : 'warn') + (engine ? '' : ' hidden');
    t.textContent = mmTagText(engine);
  }
  function translateName(force) {
    var th = (document.getElementById('e-th') || {}).value || '', mmEl = document.getElementById('e-mm');
    if (!th.trim() || !mmEl) return;
    var E = S.admin.edit;
    // ชื่อพม่าที่คนพิมพ์/ตรวจแล้ว ไม่ทับเอง — เตือนให้กดแปลใหม่แทน
    if (!force && mmEl.value.trim() && !E.mm_auto) { mmNote('⚠️ เปลี่ยนชื่อไทยแล้ว — ชื่อพม่ายังเป็นของเดิม กด 🌐 แปล ถ้าต้องการแปลใหม่'); return; }
    mmNote('กำลังแปล…');
    api('apiAdminTranslate', S.admin.pin, th.trim()).then(function (r) {
      if (!r.mm) { mmNote('แปลไม่ได้ — พิมพ์ชื่อพม่าเองได้'); return; }
      mmEl.value = r.mm; E.mm_auto = r.engine || 'google'; mmTag(E.mm_auto); mmNote('');
    }, function (e) { mmNote(errMsg(e)); });
  }
  INPUT.aNameTh = function () { clearTimeout(mmTimer); mmTimer = setTimeout(function () { translateName(false); }, 800); };
  INPUT.aNameMm = function () { S.admin.edit.mm_auto = ''; mmTag(''); mmNote(''); };
  INPUT.aUnit = function (el) {
    var mm = document.getElementById('e-umm');
    if (UNITS[el.value.trim()] && mm.dataset.manual !== '1') mm.value = UNITS[el.value.trim()];
    var lb = document.getElementById('e-bf-label');
    if (lb) lb.textContent = '1 หน่วยซื้อ ≈ กี่ ' + (el.value.trim() || 'หน่วยนับ');
  };
  INPUT.aUmm = function (el) { el.dataset.manual = '1'; };
  // หลังบ้านคืนค่าตั้งค่าแบบเบา (ไม่มียอดใช้ Claude) → เก็บยอดเดิมไว้
  function setSettings(st) {
    var old = S.admin.data.settings || {};
    if (old.claudeUsage && !st.claudeUsage) st.claudeUsage = old.claudeUsage;
    S.admin.data.settings = st;
    adminCacheSave();
  }
  INPUT.aRecvTo = function (el) {
    if (el.value === (S.admin.data.settings.recvTo || 'boss')) return;
    api('apiAdminSaveSettings', S.admin.pin, { RECV_TO: el.value }).then(function (st) {
      setSettings(st); toast('บันทึกแล้ว ✓');
    }, function (e) { toast(errMsg(e)); });
  };
  INPUT.aReportTo = function (el) {
    if (el.value === S.admin.data.settings.reportTo) return;
    api('apiAdminSaveSettings', S.admin.pin, { REPORT_TO: el.value }).then(function (st) {
      setSettings(st); toast('บันทึกแล้ว ✓');
    }, function (e) { toast(errMsg(e)); });
  };
  // เบราว์เซอร์เก่าที่ไม่รองรับ :has() — สลับไฮไลต์เอง
  INPUT.eKind = function (el) {
    var box = el.closest('.seg');
    if (box) box.querySelectorAll('label').forEach(function (l) { l.classList.toggle('on', l.contains(el)); });
  };
  INPUT.repQ = function (el) {
    S.admin.repQ = el.value;
    var b = document.getElementById('rep-body');
    if (b) b.innerHTML = reportDayBody();
  };
  INPUT.aItemQ = function (el) {
    S.admin.itemQ = el.value;
    var f = document.getElementById('a-found'), w = document.getElementById('a-zonewrap');
    if (f) f.innerHTML = adminFound();
    if (w) w.classList.toggle('hidden', !!normQ(el.value));
  };
  INPUT.plQ = function (el) {
    S.admin.plAssign.q = el.value;
    var P = S.admin.plAssign, box = document.getElementById('pl-list');
    if (!box) return;
    var q = el.value.trim().toLowerCase(), ids = shopZoneIds();
    box.innerHTML = S.admin.data.items.filter(function (it) { return it.active !== false; })
      .filter(function (it) { return !q || matchItem(it, q); })
      .filter(function (it) { return !P.onlyLeft || !plPlaces(it).some(function (z) { return ids.indexOf(z) >= 0; }) || plPlaces(it).indexOf(P.target) >= 0; })
      .sort(function (a, b) { return a.name_th.localeCompare(b.name_th, 'th'); })
      .map(function (it) { return plRow(it, P.target); }).join('');
  };
  INPUT.plOnlyLeft = function (el) { S.admin.plAssign.onlyLeft = el.checked; rerenderKeepScroll(); };
  INPUT.mvPick = function (el) {
    S.admin.move.picked[el.dataset.id] = el.checked;
    var n = Object.keys(S.admin.move.picked).filter(function (k) { return S.admin.move.picked[k]; }).length, b = document.getElementById('mv-save');
    if (b) { b.disabled = !n; b.textContent = 'ทำกับ ' + n + ' รายการ'; }
  };
  INPUT.impText = function (el) { S.admin.imp.text = el.value; };

  var DRAG = null, ROW_GAP = 8;
  document.addEventListener('pointerdown', function (ev) {
    var h = ev.target.closest('[data-drag]');
    if (!h || !S.admin || !S.admin.reorder) return;
    ev.preventDefault();
    try { h.setPointerCapture(ev.pointerId); } catch (e) { /* */ }
    var row = h.closest('.ro-row');
    DRAG = { row: row, lastY: ev.clientY + window.scrollY, clientY: ev.clientY, offset: 0 };
    row.classList.add('dragging');
    buzz();
    (function tick() {
      if (!DRAG) return;
      var edgeTop = 110, edgeBottom = window.innerHeight - 130, step = 0;
      if (DRAG.clientY < edgeTop) step = -Math.ceil((edgeTop - DRAG.clientY) / 8);
      else if (DRAG.clientY > edgeBottom) step = Math.ceil((DRAG.clientY - edgeBottom) / 8);
      if (step) { window.scrollBy(0, step); dragTo(DRAG.clientY + window.scrollY); }
      requestAnimationFrame(tick);
    })();
  }, { passive: false });
  document.addEventListener('pointermove', function (ev) {
    if (!DRAG) return;
    ev.preventDefault();
    DRAG.clientY = ev.clientY;
    dragTo(ev.clientY + window.scrollY);
  }, { passive: false });
  function dragTo(pageY) {
    var d = DRAG, row = d.row, next, prev;
    d.offset += pageY - d.lastY;
    d.lastY = pageY;
    while ((next = row.nextElementSibling) && d.offset > next.offsetHeight / 2 + ROW_GAP) {
      row.parentNode.insertBefore(next, row);
      d.offset -= next.offsetHeight + ROW_GAP;
    }
    while ((prev = row.previousElementSibling) && d.offset < -(prev.offsetHeight / 2 + ROW_GAP)) {
      row.parentNode.insertBefore(row, prev);
      d.offset += prev.offsetHeight + ROW_GAP;
    }
    row.style.transform = 'translateY(' + d.offset + 'px)';
  }
  function endDrag() {
    if (!DRAG) return;
    var row = DRAG.row, list = row.parentNode;
    DRAG = null;
    row.classList.remove('dragging');
    row.style.transform = '';
    var R = S.admin.reorder;
    var order = Array.prototype.map.call(list.children, function (r) { return r.dataset.id; });
    if (order.join() !== R.order.join()) { R.order = order; R.dirty = true; }
    Array.prototype.forEach.call(list.children, function (r, k) { r.querySelector('.num').textContent = k + 1; });
  }
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);

        .then(function (r) {
          A.data.recipes = r; if (S.boot) S.boot.recipes = r; adminCacheSave();
          toast(ls.length ? 'บันทึกสูตรแล้ว ✓' : 'ลบสูตรแล้ว'); rerenderKeepScroll();
        }, function (e) { el.disabled = false; el.textContent = '💾 บันทึกสูตร'; toast(errMsg(e)); });
    },
    aStaffAdd: function () { S.admin.staffDraft.push({ name: '', role: 'helper', active: true, sections: '' }); rerenderKeepScroll(); },
    aStaffSec: function (el) {
      var s = S.admin.staffDraft[+el.dataset.i], v = el.dataset.v, mine = L.staffSections(s);
      if (!v) mine = [];
      else if (mine.indexOf(v) >= 0) mine.splice(mine.indexOf(v), 1);
      else mine.push(v);
      s.sections = mine.join(',');
      rerenderKeepScroll();
    },
    aStaffSecNew: function (el) {
      var i = +el.dataset.i;
      promptBox('ชื่อแผนกใหม่', 'เช่น หน้าร้าน, บาร์').then(function (v) {
        var name = L.cleanSection(v || '');
        if (!name || !S.admin || !S.admin.staffDraft) return;
        var s = S.admin.staffDraft[i], mine = L.staffSections(s);
        if (mine.indexOf(name) < 0) mine.push(name);
        s.sections = mine.join(',');
        rerenderKeepScroll();
      });
    },
    aStaffSave: function (el) {
      el.disabled = true;
      api('apiAdminSaveStaff', S.admin.pin, S.admin.staffDraft).then(function (rows) {
        S.admin.data.staff = rows; S.admin.staffDraft = null;
        if (S.boot) S.boot.staff = rows.filter(function (s) { return s.active !== false; });
        toast('บันทึกทีมแล้ว ✓'); rerenderKeepScroll();
      }, function (e) { el.disabled = false; toast(errMsg(e)); });
    },
    aSaveLine: function (el) {
      var g = function (id) { var x = document.getElementById(id); return x ? x.value.trim() : ''; };
      var clr = document.getElementById('s-cleartok');
      el.disabled = true;
      api('apiAdminSaveSettings', S.admin.pin, { LINE_CHANNEL_ID: g('s-cid'), LINE_CHANNEL_SECRET: g('s-sec'), LINE_TO: g('s-to'), clearLineToken: !!(clr && clr.checked) })
        .then(function (st) { setSettings(st); S.admin.lineMsg = 'บันทึกแล้ว ✓ — กด "ทดสอบส่ง" ได้เลย'; rerenderKeepScroll(); },
          function (e) { el.disabled = false; S.admin.lineMsg = errMsg(e); rerenderKeepScroll(); });
    },
    aTestLine: function (el) {
      el.disabled = true; el.textContent = 'กำลังส่ง…';
      api('apiAdminTestLine', S.admin.pin).then(function (r) {
        S.admin.lineMsg = r.ok ? 'ส่งแล้ว ✓ เช็ค LINE ได้เลย' + (r.translate ? ' · ทดสอบแปลพม่า→ไทยผ่าน: ' + r.translate : ' · ⚠️ ทดสอบแปลพม่าไม่ผ่าน') : explainLine(r);
        rerenderKeepScroll();
      }, function (e) { S.admin.lineMsg = errMsg(e); rerenderKeepScroll(); });
    },
    fbCopyRules: function () {
      copyText(S.admin.data.settings.fbRules || '').then(function () { toast('คัดลอกกฎแล้ว — ไปวางในแท็บ Rules ของ Firebase'); }, function () { toast('คัดลอกไม่ได้ — กดค้างที่กฎแล้วเลือกคัดลอก'); });
    },
    fbSave: function (el) {
      var t = (document.getElementById('s-fbconf') || {}).value || '', clr = document.getElementById('s-fbclear');
      if (!t.trim() && !(clr && clr.checked)) { S.admin.fbMsg = 'วางโค้ด firebaseConfig ก่อน'; return rerenderKeepScroll(); }
      el.disabled = true;
      api('apiAdminSaveSettings', S.admin.pin, { FIREBASE_CONFIG: t.trim(), clearFirebase: !!(clr && clr.checked) }).then(function (st) {
        setSettings(st);
        S.admin.fbMsg = st.fbReady ? 'บันทึกแล้ว ✓ — กด "ทดสอบ" แล้วให้ทุกเครื่องปิด-เปิดแอพใหม่' : 'เลิกใช้ Firebase แล้ว ✓';
        if (S.boot) S.bootAt = 0; // ให้หน้าน้องดึงค่าใหม่ตอนกลับไป
        rerenderKeepScroll();
      }, function (e) { el.disabled = false; S.admin.fbMsg = errMsg(e); rerenderKeepScroll(); });
    },
    fbTest: function (el) {
      el.disabled = true; el.textContent = 'กำลังทดสอบ…';
      api('apiAdminTestFirebase', S.admin.pin).then(function (r) {
        S.admin.fbMsg = r.ok ? 'เชื่อม Firebase ได้ ✓ — ให้ทุกเครื่องปิด-เปิดแอพใหม่ 1 ครั้ง' : r.error;
        rerenderKeepScroll();
      }, function (e) { S.admin.fbMsg = errMsg(e); rerenderKeepScroll(); });
    },
    aSaveClaude: function (el) {
      var k = (document.getElementById('s-ckey') || {}).value || '', clr = document.getElementById('s-clearckey');
      k = k.trim();
      if (!k && !(clr && clr.checked)) { S.admin.claudeMsg = 'วาง API key ก่อน'; rerenderKeepScroll(); return; }
      el.disabled = true;
      api('apiAdminSaveSettings', S.admin.pin, { ANTHROPIC_API_KEY: k, clearClaudeKey: !!(clr && clr.checked) })
        .then(function (st) {
          setSettings(st);
          S.admin.claudeMsg = st.claudeKey ? 'บันทึกแล้ว ✓ — กด "ทดสอบแปล" ได้เลย' : 'เลิกใช้ Claude แล้ว ✓ — กลับไปใช้ Google แปล';
          rerenderKeepScroll();
        }, function (e) { el.disabled = false; S.admin.claudeMsg = errMsg(e); rerenderKeepScroll(); });
    },
    aTestClaude: function (el) {
      el.disabled = true; el.textContent = 'กำลังแปล…';
      api('apiAdminTestClaude', S.admin.pin).then(function (r) {
        var line = function (x) { return (x.engine === 'claude' ? '✨ Claude: ' : x.engine ? '🌐 Google (Claude ใช้ไม่ได้): ' : '❌ แปลไม่ได้: ') + (x.text || '-'); };
        S.admin.claudeMsg = (r.ok ? 'Claude ใช้ได้ ✓' : r.error ? r.error : 'Claude ยังใช้ไม่ได้ — ดูคอลัมน์ error ในชีต "การใช้ Claude" (มักเป็น key ผิด หรือยังไม่ได้เติมเครดิต)') +
          (r.name ? '\nหมูเด้งปลาอินทรีย์ → ' + line(r.name) + '\nဝက်သားစဉ်း ၂ အိတ် ပိုလာတယ် → ' + line(r.note) : '');
        if (r.usage) S.admin.data.settings.claudeUsage = r.usage;
        rerenderKeepScroll();
      }, function (e) { S.admin.claudeMsg = errMsg(e); rerenderKeepScroll(); });
    },
    mmRevOpen: function () { S.admin.mmRev = S.admin.mmRev || { sugg: {}, pick: {} }; go('ammrev'); },
    mmRevBack: function () { go('admin'); },
    mmRevRun: function () {
      var A = S.admin, R = A.mmRev;
      if (R.running) return;
      R.running = true; rerenderKeepScroll();
      var todo = A.data.items.filter(function (it) { return it.active !== false && it.name_th && !R.sugg[it.id]; }).map(function (it) { return it.id; });
      (function next() {
        if (S.admin !== A || !todo.length) { R.running = false; if (S.screen === 'ammrev') rerenderKeepScroll(); return; }
        var ids = todo.splice(0, MMREV_BATCH);
        api('apiAdminReviewMm', A.pin, ids).then(function (r) {
          r.items.forEach(function (x) { R.sugg[x.id] = x; });
          ids.forEach(function (id) { if (!R.sugg[id]) R.sugg[id] = { ok: true }; });
          if (S.screen === 'ammrev') rerenderKeepScroll();
          next();
        }, function (e) { R.running = false; rerenderKeepScroll(); toast(errMsg(e)); });
      })();
    },
    mmRevPick: function (el) { var R = S.admin.mmRev; R.pick[el.dataset.id] = R.pick[el.dataset.id] === el.dataset.v ? '' : el.dataset.v; rerenderKeepScroll(); },
    mmRevSave: function () {
      var A = S.admin, R = A.mmRev;
      var ch = Object.keys(R.pick).filter(function (id) { return (R.pick[id] === 'new' || R.pick[id] === 'mon') && R.sugg[id] && R.sugg[id].mm; })
        .map(function (id) { return { id: id, mm: R.sugg[id].mm, verified: R.pick[id] === 'mon' }; });
      if (!ch.length) return;
      R.saving = true; rerenderKeepScroll();
      api('apiAdminSetMm', A.pin, ch).then(function (r) {
        A.data.items = r.items;
        if (S.boot) S.boot.items = r.items.filter(function (i) { return i.active !== false; });
        ch.forEach(function (c) { delete R.sugg[c.id]; delete R.pick[c.id]; R.sugg[c.id] = { ok: true }; });
        R.saving = false;
        toast('บันทึกชื่อพม่า ' + r.saved + ' รายการแล้ว ✓');
        rerenderKeepScroll();
      }, function (e) { R.saving = false; rerenderKeepScroll(); toast(errMsg(e)); });
    },
    aRetranslate: function (el) {
      el.disabled = true; el.textContent = 'Claude กำลังแปล… (รายการละไม่กี่วินาที)';
      api('apiAdminRetranslate', S.admin.pin).then(function (r) {
        S.admin.data.items = r.items;
        if (S.boot) S.boot.items = r.items.filter(function (i) { return i.active !== false; });
        toast(r.done ? '✨ Claude แปลใหม่ ' + r.done + ' รายการ' + (r.left ? ' · เหลืออีก ' + r.left + ' กดอีกครั้ง' : '') : 'Claude แปลไม่สำเร็จ — ลองกดทดสอบแปลในหน้าตั้งค่า');
        rerenderKeepScroll();
      }, function (e) { el.disabled = false; toast(errMsg(e)); });
    },
    aSaveCodes: function (el) {
      var g = function (id) { return document.getElementById(id).value.trim(); };
      var newAdmin = g('s-apin');
      el.disabled = true;
      var day = document.getElementById('s-day');
      api('apiAdminSaveSettings', S.admin.pin, { STAFF_PIN: g('s-spin'), ADMIN_PIN: newAdmin, FULL_COUNT_DAY: day ? day.value : '' }).then(function (st) {
        if (newAdmin) S.admin.pin = newAdmin;
        if (S.boot) S.boot.fullCountDay = st.fullCountDay;
        setSettings(st); toast('บันทึกแล้ว ✓'); rerenderKeepScroll();
      }, function (e) { el.disabled = false; toast(errMsg(e)); });
    }
  };

  function explainLine(r) {
    var st = r.status || '';
    if (st === 'group_not_linked') return 'ยังไม่ได้เชื่อมกลุ่ม';
    if (st === 'line_not_set') return 'ยังใส่ข้อมูล LINE ไม่ครบ (ต้องมี Channel ID, Channel secret และ Your user ID)';
    if (/line_400/.test(st)) return 'LINE ปฏิเสธ (400) — มักเป็นเพราะ User ID ผิด หรือบอสยังไม่ได้แอด OA ร้านเป็นเพื่อน · ' + (r.detail || '');
    if (/line_401|token/.test(st + (r.detail || ''))) return 'Channel ID หรือ secret ไม่ถูก (401) · ' + (r.detail || '');
    if (/line_429/.test(st)) return 'โควตาข้อความ OA เดือนนี้เต็ม (429) — ระหว่างนี้แอพจะส่งทางอีเมลแทน';
    return 'ส่งไม่ผ่าน: ' + st + ' ' + (r.detail || '');
  }

  start();
})();

</script>
</body>
</html>
